          - 'heading "Fifth: Subject to any additional vote required by this Certificate of Incorporation or the Bylaws of the Corporation, in furtherance and not in limitation of the powers conferred by statute, the Board of Directors is expressly authorized to make, repeal, alter, amend and rescind any or all of the Bylaws of the Corporation." [level=2] [ref=e690]'
          - 'heading "Sixth: Subject to any additional vote required by this Certificate of Incorporation, the number of directors of the Corporation shall be determined in the manner set forth in the Bylaws of the Corporation." [level=2] [ref=e691]'
          - 'heading "Seventh: Elections of directors need not be by written ballot unless the Bylaws of the Corporation shall so provide." [level=2] [ref=e692]'
          - 'heading "Eighth: Meetings of stockholders may be held within or outside of the State of Delaware, as the Bylaws of the Corporation may provide. The books of the Corporation may be kept (subject to any provision of applicable law) outside of the State of Delaware at such place or places or in such manner or manners as may be designated from time to time by the Board of Directors or in the Bylaws of the Corporation." [level=2] [ref=e693]'
          - 'heading "Ninth: To the fullest extent permitted by law, a director [or officer] of the Corporation shall not be personally liable to the Corporation or its stockholders for monetary damages for breach of fiduciary duty as a director [or officer]. If the General Corporation Law or any other law of the State of Delaware is amended after approval by the stockholders of this Article Ninth to authorize corporate action further eliminating or limiting the personal liability of directors [or officers], then the liability of a director [or officer] of the Corporation shall be eliminated or limited to the fullest extent permitted by the General Corporation Law as so amended." [level=2] [ref=e694]'
          - paragraph [ref=e695]:
            - text: Any amendment, repeal or elimination of the foregoing provisions of this Article Ninth by the stockholders of the Corporation shall not adversely affect any right or protection of a director [or officer] of the Corporation existing at the time of, or increase the liability of any director [or officer] of the Corporation with respect to any acts or omissions of such director [or officer] occurring prior to, such amendment, repeal or elimination.
            - link [ref=e696] [cursor=pointer]:
              - /url: "#fn-87"
              - superscript [ref=e697]: "86"
          - heading [level=2] [ref=e698]:
            - text: Tenth
            - link [ref=e699] [cursor=pointer]:
              - /url: "#fn-88"
              - superscript [ref=e700]: "87"
            - superscript [ref=e702]
            - text: To the fullest extent permitted by applicable law, the Corporation is authorized to provide indemnification of (and advancement of expenses to) directors, officers and agents of the Corporation (and any other persons to which the General Corporation Law permits the Corporation to provide indemnification) through Bylaw provisions, agreements with such agents or other persons, vote of stockholders or disinterested directors or otherwise, in excess of the indemnification and advancement otherwise permitted by Section 145 of the General Corporation Law.
          - paragraph [ref=e703]: Any amendment, repeal, modification or elimination of the foregoing provisions of this Article Tenth shall not (a) adversely affect any right or protection of any director, officer or other agent of the Corporation existing at the time of such amendment, repeal, modification or elimination; or (b) increase the liability of any director, officer or agent of the Corporation with respect to any acts or omissions of such director, officer or agent occurring prior to such amendment, repeal, modification or elimination.
          - heading [level=2] [ref=e704]:
            - text: "Eleventh: The Corporation renounces, to the fullest extent permitted by law, any interest or expectancy of the Corporation in, or in being offered an opportunity to participate in, any Excluded Opportunity. An “Excluded Opportunity” is any matter, transaction or interest that is presented to, or acquired, created or developed by, or which otherwise comes into the possession of (i) any director of the Corporation who is not an employee of the Corporation or any of its subsidiaries, or (ii) any holder of Preferred Stock or any partner, member, director, stockholder, employee, affiliate or agent of any such holder, other than someone who is an officer or employee of the Corporation or any of its subsidiaries (collectively, the persons referred to in clauses (i) and (ii) are “Covered Persons”), unless such matter, transaction or interest is presented to, or acquired, created or developed by, or otherwise comes into the possession of, a Covered Person expressly and solely in such Covered Person’s capacity as a director of the Corporation while such Covered Person is performing services in such capacity. Any repeal or modification of this Article Eleventh will only be prospective and will not affect the rights under this Article Eleventh in effect at the time of the occurrence of any actions or omissions to act giving rise to liability. Notwithstanding anything to the contrary contained elsewhere in this Certificate of Incorporation, in addition to any other vote required by law or this Certificate of Incorporation, the affirmative vote of the Requisite Holders will be required to amend or repeal, or to adopt any provisions inconsistent with this Article Eleventh."
            - link [ref=e705] [cursor=pointer]:
              - /url: "#fn-89"
              - superscript [ref=e706]: "88"
          - heading [level=2] [ref=e707]:
            - text: "Twelfth: [Unless the Corporation consents in writing to the selection of an alternative forum, the Court of Chancery in the State of Delaware shall be the sole and exclusive forum for any stockholder (including a beneficial owner) to bring (i) any derivative action or proceeding brought on behalf of the Corporation, (ii) any action asserting a claim of breach of fiduciary duty owed by any director, officer or other employee of the Corporation to the Corporation or the Corporation’s stockholders, (iii) any action asserting a claim against the Corporation, its directors, officers or employees arising pursuant to any provision of the General Corporation Law or the Corporation’s certificate of incorporation or bylaws or (iv) any action asserting a claim against the Corporation, its directors, officers or employees governed by the internal affairs doctrine or that otherwise relates to the internal affairs of the Corporation, except for, as to each of (i) through (iv) above, any claim as to which the Court of Chancery determines that there is an indispensable party not subject to the jurisdiction of the Court of Chancery (and the indispensable party does not consent to the personal jurisdiction of the Court of Chancery within 10 days following such determination), which is vested in the exclusive jurisdiction of a court or forum other than the Court of Chancery, or for which the Court of Chancery does not have subject matter jurisdiction.]"
            - superscript [ref=e709]
            - link [ref=e710] [cursor=pointer]:
