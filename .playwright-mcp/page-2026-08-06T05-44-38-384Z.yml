          - heading "3.1 General. On any matter presented to the stockholders of the Corporation for their action or consideration at any meeting of stockholders of the Corporation (or by written consent of stockholders in lieu of a meeting), each holder of outstanding shares of Preferred Stock shall be entitled to cast the number of votes equal to the number of whole shares of Common Stock into which the shares of Preferred Stock held by such holder are convertible (as provided in Section 4 below) as of the record date for determining stockholders entitled to vote on such matter. Except as provided by law or by the other provisions of this Certificate of Incorporation, holders of Preferred Stock shall vote together with the holders of Common Stock as a single class and on an as-converted to Common Stock basis." [level=5] [ref=e313]:
            - generic [ref=e314]: "3.1"
            - text: General. On any matter presented to the stockholders of the Corporation for their action or consideration at any meeting of stockholders of the Corporation (or by written consent of stockholders in lieu of a meeting), each holder of outstanding shares of Preferred Stock shall be entitled to cast the number of votes equal to the number of whole shares of Common Stock into which the shares of Preferred Stock held by such holder are convertible (as provided in Section 4 below) as of the record date for determining stockholders entitled to vote on such matter. Except as provided by law or by the other provisions of this Certificate of Incorporation, holders of Preferred Stock shall vote together with the holders of Common Stock as a single class and on an as-converted to Common Stock basis.
