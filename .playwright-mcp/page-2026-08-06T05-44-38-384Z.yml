          - paragraph [ref=e292]:
            - generic [ref=e293]: (a)
            - text: The Corporation shall not have the power to effect a Deemed Liquidation Event referred to in Section 2.3.1(a)(i) unless the agreement or plan with respect to such transaction, or terms of such transaction (any such agreement, plan or terms, the “Transaction Document”), provide that the consideration payable to the stockholders of the Corporation in such Deemed Liquidation Event shall be allocated to the holders of capital stock of the Corporation in accordance with Sections 2.1 and 2.2.
          - paragraph [ref=e294]:
            - generic [ref=e295]: (b)
            - text: "[In the event of a Deemed Liquidation Event referred to in Section 2.3.1(a)(ii) or 2.3.1(b), if the Corporation does not effect a dissolution of the Corporation under the General Corporation Law within 90 days after such Deemed Liquidation Event, then (i) the Corporation shall send a written notice to each holder of Preferred Stock no later than the 90th day after the Deemed Liquidation Event advising such holders of their right (and the requirements to be met to secure such right) pursuant to the terms of the following clause (ii) to require the redemption of such shares of Preferred Stock, and (ii) if the Requisite Holders so request in a written instrument delivered to the Corporation not later than 120 days after such Deemed Liquidation Event, the Corporation shall use the consideration received by the Corporation for such Deemed Liquidation Event (net of any retained liabilities associated with the assets sold or technology licensed, any other expenses reasonably related to such Deemed Liquidation Event or any other expenses incident to the dissolution of the Corporation as provided herein, in each case as determined in good faith by the Board of Directors), together with any other assets of the Corporation available for distribution to its stockholders, all to the extent permitted by Delaware law governing distributions to stockholders (the “Available Proceeds”) on the 150th day after such Deemed Liquidation Event (the “DLE Redemption Date”), to redeem all outstanding shares of Preferred Stock at a price per share equal to the applicable Liquidation Amount; provided, that if the definitive agreements governing such Deemed Liquidation Event contain contingent indemnification obligations on the part of the Corporation and prohibit the Corporation from distributing all or a portion of the Available Proceeds while such indemnification obligations remain outstanding, then the DLE Redemption Date shall automatically be extended to the date that is ten business days following the date on which such prohibition expires. Notwithstanding the foregoing, in the event of a redemption pursuant to the preceding sentence, if the Available Proceeds are not sufficient to redeem all outstanding shares of Preferred Stock, the Corporation shall redeem a pro rata portion of each holder’s shares of Preferred Stock to the fullest extent of such Available Proceeds, based on the respective amounts which would otherwise be payable in respect of the shares to be redeemed if the Available Proceeds were sufficient to redeem all such shares, and shall redeem the remaining shares as soon as it may lawfully do so under Delaware law governing distributions to stockholders. Prior to the distribution or redemption provided for in this Section 2.3.2(b), the Corporation shall not expend or dissipate the Available Proceeds for any purpose, except to discharge expenses incurred in connection with such Deemed Liquidation Event. In connection with a distribution or redemption provided for in Section 2.3.2, the Corporation shall send written notice of the redemption (the “Redemption Notice”) to each holder of record of Preferred Stock. Each Redemption Notice shall state:"
