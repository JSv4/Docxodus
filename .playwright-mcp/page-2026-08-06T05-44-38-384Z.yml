          - heading [level=5] [ref=e596]:
            - generic [ref=e597]: "5.2"
            - text: Procedural Requirements. All holders of record of shares of Preferred Stock (or the applicable series thereof) shall be sent written notice of the Mandatory Conversion Time and the place designated for mandatory conversion of all such shares of Preferred Stock pursuant to this Section 5. Such notice need not be sent in advance of the occurrence of the Mandatory Conversion Time. Upon receipt of such notice, each holder of shares of Preferred Stock being converted that holds such shares of Preferred Stock in certificated form shall surrender his, her or its certificate or certificates for all such shares (or, if such holder alleges that such certificate has been lost, stolen or destroyed, a lost certificate affidavit and agreement reasonably acceptable to the Corporation to indemnify the Corporation against any claim that may be made against the Corporation on account of the alleged loss, theft or destruction of such certificate) to the Corporation at the place designated in such notice. If so required by the Corporation, any certificates surrendered for conversion shall be endorsed or accompanied by written instrument or instruments of transfer, in form satisfactory to the Corporation, duly executed by the registered holder or by his, her or its attorney duly authorized in writing. All rights with respect to the Preferred Stock converted pursuant to Section 5.1, including the rights, if any, to receive notices and vote (other than as a holder of Common Stock), will terminate at the Mandatory Conversion Time (notwithstanding the failure of the holder or holders thereof to surrender any certificates at or prior to such time), except only the rights of the holders thereof, upon surrender of any certificate or certificates of such holders (or lost certificate affidavit and agreement) therefor, to receive the items provided for in the next sentence of this Section 5.2. As soon as practicable after the Mandatory Conversion Time and, if applicable, the surrender of any certificate or certificates (or lost certificate affidavit and agreement) for Preferred Stock, the Corporation shall (a) issue and deliver to such holder, or to his, her or its nominees, a certificate or certificates for the number of full shares of Common Stock issuable on such conversion in accordance with the provisions hereof or issue and deliver to such holder, or to his, her or its nominees, a notice of issuance of uncertificated shares and may, upon written request, issue and deliver a certificate for the number of full shares of Common Stock issuable upon such conversion in accordance with the provisions hereof; and (b) pay any declared but unpaid dividends on the shares of Preferred Stock converted.
