          - heading "6.2 Redemption Notice. The Corporation shall send written notice of the mandatory redemption (the “Redemption Notice”) to each holder of record of Preferred Stock not less than 40 days prior to each Redemption Date. Each Redemption Notice shall state:" [level=5] [ref=e663]:
