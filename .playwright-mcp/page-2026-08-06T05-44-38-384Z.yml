          - heading "4. Optional Conversion. The holders of the Preferred Stock shall have conversion rights as follows (the “Conversion Rights”):" [level=4] [ref=e407]:
            - generic [ref=e408]: "4."
            - text: "Optional Conversion. The holders of the Preferred Stock shall have conversion rights as follows (the “Conversion Rights”):"
          - heading "4.1 Right to Convert." [level=5] [ref=e409]:
            - generic [ref=e410]: "4.1"
            - text: Right to Convert.
          - heading [level=6] [ref=e411]:
            - generic [ref=e412]: 4.1.1
            - text: Conversion Ratio. Each share of Preferred Stock shall be convertible, at the option of the holder thereof, at any time, and without the payment of additional consideration by the holder thereof, into such whole number of fully paid and non-assessable shares of Common Stock (calculated as provided in Section 4.2 below), as is determined by dividing the applicable Original Issue Price
            - link [ref=e413] [cursor=pointer]:
              - /url: "#fn-47"
              - superscript [ref=e414]: "46"
            - text: by the applicable Conversion Price (as defined below) in effect at the time of conversion. The “Conversion Price” applicable to the Preferred Stock as of the Original Issue Date shall be equal to $_______ [insert original purchase price of Series A Preferred Stock] per share of Series A Preferred Stock. Such initial Conversion Price for a series of Preferred Stock, and the rate at which shares of Preferred Stock may be converted into shares of Common Stock, shall be subject to adjustment as provided in this Section 4. [Notwithstanding the foregoing and notwithstanding Section 4.3.1, the optional right to convert shares of Preferred Stock into shares of Common Stock pursuant to the first sentence of this Section 4.1.1 shall be suspended, and no optional conversion may be effective, from and after the date the Corporation delivers (pursuant to Section 5A.1 below) notice of a Qualified Financing (as defined below) until immediately after the earlier of (x) consummation of the Qualified Financing and the associated Special Mandatory Conversion or (y) termination of the Qualified Financing; provided, however, that the foregoing limitation on the right to optionally convert shares into Common Stock pursuant to this Section 4.1.1 shall not affect the calculation of the number of shares deemed issuable upon conversion of such shares for purposes of (A) voting rights under this Certificate of Incorporation, or (B) determining amounts payable in respect of shares of Preferred Stock in connection with a dissolution, liquidation, or winding up of the Corporation or pursuant to a Deemed Liquidation Event.]
            - link [ref=e415] [cursor=pointer]:
              - /url: "#fn-48"
              - superscript [ref=e416]: "47"
          - heading [level=6] [ref=e417]:
            - generic [ref=e418]: 4.1.2
            - text: Termination of Conversion Rights. In the event of a notice of redemption of any shares of Preferred Stock pursuant to Section 2.3.2(b) [or Section 6.1], the Conversion Rights of the shares designated for redemption shall terminate at 5:00 p.m. [Eastern/Pacific] time (the “close of business” for purposes hereof) on the last full day preceding the date fixed for redemption, unless the redemption price is not fully paid on such redemption date, in which case the Conversion Rights for such shares shall continue until such price is paid in full. In the event of a liquidation, dissolution or winding up of the Corporation or a Deemed Liquidation Event, the Conversion Rights shall terminate at the close of business on the last full day preceding the date fixed for the payment of any such amounts distributable on such event to the holders of Preferred Stock; provided that the foregoing termination of Conversion Rights shall not affect the amount(s) otherwise paid or payable in accordance with Section 2.1 to the holders of Preferred Stock pursuant to such liquidation, dissolution or winding up of the Corporation or a Deemed Liquidation Event.
          - heading "4.2 Number of Shares Issuable Upon Conversion. The number of shares of Common Stock issuable to a holder of Preferred Stock upon conversion of such Preferred Stock shall be the nearest whole share, after aggregating all fractional interests in shares of Common Stock that would otherwise be issuable upon conversion of all shares of that same series of Preferred Stock being converted by such holder (with any fractional interests after such aggregation representing 0.5 or greater of a whole share being entitled to a whole share)48. For the avoidance of doubt, no fractional interests in shares of Common Stock shall be created or issuable as a result of the conversion of the Preferred Stock pursuant to Section 4.1.1." [level=5] [ref=e419]:
