            - text: If upon any such liquidation, dissolution or winding up of the Corporation or Deemed Liquidation Event, the assets of the Corporation available for distribution to its stockholders shall be insufficient to pay the holders of shares of Preferred Stock the full amount to which they shall be entitled under this Section 2.1, the holders of shares of Preferred Stock shall share ratably in any distribution of the assets available for distribution in proportion to the respective amounts which would otherwise be payable in respect of the shares held by them upon such distribution if all amounts payable on or with respect to such shares were paid in full.
          - paragraph [ref=e252]:
            - generic [ref=e253]: "2.2"
            - text: Distribution of Remaining Assets. In the event of any voluntary or involuntary liquidation, dissolution or winding up of the Corporation, after the payment in full of all amounts required to be paid to the holders of shares of Preferred Stock pursuant to Section 2.1, the remaining assets of the Corporation available for distribution to its stockholders or, in the case of a Deemed Liquidation Event, the consideration not payable to the holders of shares of Preferred Stock pursuant to Section 2.1 or the remaining Available Proceeds, as the case may be, shall be distributed among the holders of the shares of Preferred Stock and Common Stock, pro rata based on the number of shares held by each such holder, treating for this purpose all such securities as if they had been converted to Common Stock pursuant to the terms of this Certificate of Incorporation immediately prior to such liquidation, dissolution or winding up of the Corporation.
