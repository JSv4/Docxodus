            - text: Certificate as to Adjustments. Upon the occurrence of each adjustment or readjustment of the Conversion Price of a series of Preferred Stock pursuant to this Section 4, the Corporation at its expense shall, as promptly as reasonably practicable but in any event not later than ten days thereafter, compute such adjustment or readjustment in accordance with the terms hereof and furnish to each holder of such series of Preferred Stock a certificate setting forth such adjustment or readjustment (including the kind and amount of securities, cash or other property into which such series of Preferred Stock is convertible) and showing in detail the facts upon which such adjustment or readjustment is based. The Corporation shall, as promptly as reasonably practicable after the written request at any time of any holder of Preferred Stock (but in any event not later than [10] days thereafter), furnish or cause to be furnished to such holder a certificate setting forth (i) the Conversion Price then in effect for each series of Preferred Stock held by such holder, and (ii) the number of shares of Common Stock and the amount, if any, of other securities, cash or property which then would be received upon the conversion of each such series of Preferred Stock.
