          - heading "4.3.5 Taxes. The Corporation shall pay any and all issue and other similar taxes that may be payable in respect of any issuance or delivery of shares of Common Stock upon conversion of shares of Preferred Stock pursuant to this Section 4. The Corporation shall not, however, be required to pay any tax which may be payable in respect of any transfer involved in the issuance and delivery of shares of Common Stock in a name other than that in which the shares of Preferred Stock so converted were registered, and no such issuance or delivery shall be made unless and until the person or entity requesting such issuance has paid to the Corporation the amount of any such tax or has established, to the satisfaction of the Corporation, that such tax has been paid." [level=6] [ref=e437]:
