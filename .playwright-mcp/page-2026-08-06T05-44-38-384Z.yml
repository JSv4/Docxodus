          - heading "4.4.5 Determination of Consideration. For purposes of this Section 4.4, the consideration received by the Corporation for the issuance or deemed issuance of any Additional Shares of Common Stock shall be computed as follows:" [level=6] [ref=e527]:
            - generic [ref=e528]: 4.4.5
            - text: "Determination of Consideration. For purposes of this Section 4.4, the consideration received by the Corporation for the issuance or deemed issuance of any Additional Shares of Common Stock shall be computed as follows:"
