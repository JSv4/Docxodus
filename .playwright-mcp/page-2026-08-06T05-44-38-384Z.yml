            - text: Upon the expiration or termination of any unexercised Option or unconverted or unexchanged Convertible Security (or portion thereof) which resulted (either upon its original issuance or upon a revision of its terms) in an adjustment to the Conversion Price of any series of Preferred Stock pursuant to the terms of Section 4.4.4, the Conversion Price of such series of Preferred Stock shall be readjusted to such Conversion Price for such series of Preferred Stock as would have obtained had such Option or Convertible Security (or portion thereof) never been issued.
          - paragraph [ref=e491]:
            - generic [ref=e492]: (e)
            - text: If the number of shares of Common Stock issuable upon the exercise, conversion and/or exchange of any Option or Convertible Security, or the consideration payable to the Corporation upon such exercise, conversion and/or exchange, is calculable at the time such Option or Convertible Security is issued or amended but is potentially subject to adjustment based upon subsequent events, any adjustment to the Conversion Price of a series of Preferred Stock provided for in this Section 4.4.3 shall be effected at the time of such issuance or amendment based on such number of shares or amount of consideration without regard to any provisions for subsequent adjustments (and any subsequent adjustments shall be treated as provided in clauses (b) and (c) of this Section 4.4.3). If the number of shares of Common Stock issuable upon the exercise, conversion and/or exchange of any Option or Convertible Security, or the consideration payable to the Corporation upon such exercise, conversion and/or exchange, cannot be calculated at all at the time such Option or Convertible Security is issued or amended, any adjustment to the Conversion Price of a series of Preferred Stock that would result under the terms of this Section 4.4.3 at the time of such issuance or amendment shall instead be effected at the time such number of shares and/or amount of consideration is first calculable (even if subject to subsequent adjustments), assuming for purposes of calculating such adjustment to the Conversion Price for such series of Preferred Stock that such issuance or amendment took place at the time such calculation can first be made. In the event an Option or Convertible Security contains alternative conversion terms, such as a cap on the valuation of the Corporation at which such conversion will be effected, or circumstances where the Option or Convertible Security may be repaid in lieu of conversion, then the number of shares of Common Stock issuable upon the exercise, conversion and/or exchange of such Option or Convertible Security shall be deemed not calculable until such time as the applicable conversion terms are determined.
