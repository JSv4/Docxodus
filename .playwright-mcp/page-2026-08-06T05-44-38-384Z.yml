            - link [ref=e549] [cursor=pointer]:
              - /url: "#fn-59"
              - superscript [ref=e550]: "58"
            - text: If at any time or from time to time after the Original Issue Date the Corporation shall effect a subdivision of the outstanding Common Stock, the Conversion Price of each series of Preferred Stock in effect immediately before that subdivision shall be proportionately decreased so that the number of shares of Common Stock issuable on conversion of each share of such series shall be increased in proportion to such increase in the aggregate number of shares of Common Stock outstanding. If the Corporation shall at any time or from time to time after the Original Issue Date combine the outstanding shares of Common Stock, the Conversion Price of each series of Preferred Stock in effect immediately before the combination shall be proportionately increased so that the number of shares of Common Stock issuable on conversion of each share of such series shall be decreased in proportion to such decrease in the aggregate number of shares of Common Stock outstanding. Any adjustment under this Section 4.5 shall become effective at the close of business on the date the subdivision or combination becomes effective.
          - heading "4.6 Adjustment for Certain Dividends and Distributions. If at any time or from time to time after the Original Issue Date the Corporation shall make or issue, or fix a record date for the determination of holders of Common Stock entitled to receive, a dividend or other distribution payable on the Common Stock in additional shares of Common Stock, then and in each such event the Conversion Price of each series of Preferred Stock in effect immediately before such event shall be decreased as of the time of such issuance or, if such a record date shall have been fixed, as of the close of business on such record date, by multiplying the Conversion Price of each such series of Preferred Stock then in effect by a fraction:" [level=5] [ref=e551]:
