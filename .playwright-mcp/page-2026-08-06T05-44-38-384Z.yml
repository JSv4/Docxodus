          - heading "1. General. The voting, dividend and liquidation rights of the holders of the Common Stock are subject to and qualified by the powers, preferences and special rights of the holders of the Preferred Stock set forth herein." [level=4] [ref=e197]:
            - generic [ref=e198]: "1."
            - text: General. The voting, dividend and liquidation rights of the holders of the Common Stock are subject to and qualified by the powers, preferences and special rights of the holders of the Preferred Stock set forth herein.
          - heading [level=4] [ref=e199]:
            - generic [ref=e200]: "2."
            - text: Voting. Except as otherwise provided herein or by applicable law, the holders of the Common Stock shall be entitled to one vote for each share of Common Stock held as of the applicable record date for each meeting of stockholders (and written actions in lieu of meetings)[; provided, however, that, except as otherwise required by law, holders of Common Stock, as such, shall not be entitled to vote on any amendment to this Amended and Restated Certificate of Incorporation (this “Certificate of Incorporation”) that relates solely to the terms of one or more outstanding series of Preferred Stock if the holders of such affected series are entitled, either separately or together with the holders of one or more other such series, to vote thereon pursuant to this Certificate of Incorporation or pursuant to the General Corporation Law].
