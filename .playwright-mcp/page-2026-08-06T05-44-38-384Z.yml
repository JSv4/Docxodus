          - heading "7. Redeemed or Otherwise Acquired Shares. Unless approved by the Board of Directors and the Requisite Holders, any shares of Preferred Stock that are redeemed, converted or otherwise acquired by the Corporation or any of its subsidiaries shall be automatically and immediately cancelled and retired and shall not be reissued, sold or transferred. Neither the Corporation nor any of its subsidiaries may exercise any voting or other rights granted to the holders of Preferred Stock following redemption, conversion or acquisition. The Corporation may thereafter take such appropriate action (without the need for stockholder action) as may be necessary to reduce the authorized number of shares of Preferred Stock accordingly." [level=4] [ref=e684]:
            - generic [ref=e685]: "7."
            - text: Redeemed or Otherwise Acquired Shares. Unless approved by the Board of Directors and the Requisite Holders, any shares of Preferred Stock that are redeemed, converted or otherwise acquired by the Corporation or any of its subsidiaries shall be automatically and immediately cancelled and retired and shall not be reissued, sold or transferred. Neither the Corporation nor any of its subsidiaries may exercise any voting or other rights granted to the holders of Preferred Stock following redemption, conversion or acquisition. The Corporation may thereafter take such appropriate action (without the need for stockholder action) as may be necessary to reduce the authorized number of shares of Preferred Stock accordingly.
          - heading "8. Waiver. Except as otherwise set forth herein, (a) any of the rights, powers, preferences and other terms of the Preferred Stock set forth herein may be waived on behalf of all holders of Preferred Stock by the affirmative written consent or vote of the holders that would otherwise be required to amend such right, powers, preferences, and other terms and (b) at any time more than one series of Preferred Stock is issued and outstanding, any of the rights, powers, preferences and other terms of any series of Preferred Stock set forth herein may be waived on behalf of all holders of such series of Preferred Stock by the affirmative written consent or vote of the holders of such series that would otherwise be required to amend such right, power, preference, or other term." [level=4] [ref=e686]:
