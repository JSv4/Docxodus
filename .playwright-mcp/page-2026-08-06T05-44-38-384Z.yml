          - heading [level=5] [ref=e645]:
            - generic [ref=e646]: "6.1"
            - text: "[General. Unless prohibited by Delaware law governing distributions to stockholders, shares of Preferred Stock shall be redeemed by the Corporation at a price per share of such Preferred Stock equal to [the greater of (A)][the applicable Original Issue Price, plus all declared but unpaid dividends thereon]"
            - link [ref=e647] [cursor=pointer]:
              - /url: "#fn-78"
              - superscript [ref=e648]: "77"
            - text: "[and (B) the Fair Market Value (determined in the manner set forth below) of such share of Preferred Stock as of the date of the Corporation’s receipt of the Redemption Request] (the “Redemption Price”),"
            - link [ref=e649] [cursor=pointer]:
              - /url: "#fn-79"
              - superscript [ref=e650]: "78"
            - text: in three annual installments commencing not more than 60 days after receipt by the Corporation at any time on or after [_____________] from the Requisite Holders of written notice requesting redemption of all shares of Preferred Stock
            - link [ref=e651] [cursor=pointer]:
