          - heading "2.2 Payments to Holders of Common Stock. In the event of any voluntary or involuntary liquidation, dissolution or winding up of the Corporation, after the payment in full of all Liquidation Amounts required to be paid to the holders of shares of Preferred Stock, the remaining assets of the Corporation available for distribution to its stockholders or, in the case of a Deemed Liquidation Event, the consideration not payable to the holders of shares of Preferred Stock pursuant to Section 2.1 or the remaining Available Proceeds, as the case may be, shall be distributed among the holders of shares of Common Stock, pro rata based on the number of shares of Common Stock held by each such holder." [level=5] [ref=e245]:
