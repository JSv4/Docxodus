            - text: "Adjustment for Certain Dividends and Distributions. If at any time or from time to time after the Original Issue Date the Corporation shall make or issue, or fix a record date for the determination of holders of Common Stock entitled to receive, a dividend or other distribution payable on the Common Stock in additional shares of Common Stock, then and in each such event the Conversion Price of each series of Preferred Stock in effect immediately before such event shall be decreased as of the time of such issuance or, if such a record date shall have been fixed, as of the close of business on such record date, by multiplying the Conversion Price of each such series of Preferred Stock then in effect by a fraction:"
