          - paragraph [ref=e739]: (Alternative Indemnification Provisions)
          - paragraph [ref=e740]: "TENTH: The following indemnification provisions shall apply to the persons enumerated below."
          - heading [level=2] [ref=e741]:
            - generic [ref=e742]: "1."
            - text: Right to Indemnification of Directors and Officers.
            - link [ref=e743] [cursor=pointer]:
              - /url: "#fn-94"
              - superscript [ref=e744]: "93"
            - text: The Corporation shall indemnify and hold harmless, to the fullest extent permitted by applicable law as it presently exists or may hereafter be amended, any person (an “Indemnified Person”) who was or is made or is threatened to be made a party or is otherwise involved in any action, suit or proceeding, whether civil, criminal, administrative or investigative (a “Proceeding”), by reason of the fact that such person, or a person for whom such person is the legal representative, is or was a director or officer of the Corporation or, while a director or officer of the Corporation, is or was serving at the request of the Corporation as a director, officer, employee or agent of another corporation or of a partnership, joint venture, limited liability company, trust, enterprise or nonprofit entity, including service with respect to employee benefit plans, against all liability and loss suffered and expenses (including attorneys’ fees) reasonably incurred by such Indemnified Person in such Proceeding. Notwithstanding the preceding sentence, except as otherwise provided in Section 3 of this Article Tenth, the Corporation shall be required to indemnify an Indemnified Person in connection with a Proceeding (or part thereof) commenced by such Indemnified Person only if the commencement of such Proceeding (or part thereof) by the Indemnified Person was authorized in advance by the Board of Directors.
            - link [ref=e745] [cursor=pointer]:
              - /url: "#fn-95"
              - superscript [ref=e746]: "94"
          - heading "2. Prepayment of Expenses of Directors and Officers. The Corporation shall pay the expenses (including attorneys’ fees) incurred by an Indemnified Person in defending any Proceeding in advance of its final disposition, provided, however, that, to the extent required by law, such payment of expenses in advance of the final disposition of the Proceeding shall be made only upon receipt of an undertaking by the Indemnified Person to repay all amounts advanced if it should be ultimately determined that the Indemnified Person is not entitled to be indemnified under this Article Tenth or otherwise." [level=2] [ref=e747]:
            - generic [ref=e748]: "2."
            - text: Prepayment of Expenses of Directors and Officers. The Corporation shall pay the expenses (including attorneys’ fees) incurred by an Indemnified Person in defending any Proceeding in advance of its final disposition, provided, however, that, to the extent required by law, such payment of expenses in advance of the final disposition of the Proceeding shall be made only upon receipt of an undertaking by the Indemnified Person to repay all amounts advanced if it should be ultimately determined that the Indemnified Person is not entitled to be indemnified under this Article Tenth or otherwise.
          - heading "3. Claims by Directors and Officers. If a claim for indemnification or advancement of expenses under this Article Tenth is not paid in full within 30 days after a written claim therefor by the Indemnified Person has been received by the Corporation, the Indemnified Person may file suit to recover the unpaid amount of such claim and, if successful in whole or in part, shall be entitled to be paid the expense of prosecuting such claim. In any such action the Corporation shall have the burden of proving that the Indemnified Person is not entitled to the requested indemnification or advancement of expenses under applicable law." [level=2] [ref=e749]:
            - generic [ref=e750]: "3."
            - text: Claims by Directors and Officers. If a claim for indemnification or advancement of expenses under this Article Tenth is not paid in full within 30 days after a written claim therefor by the Indemnified Person has been received by the Corporation, the Indemnified Person may file suit to recover the unpaid amount of such claim and, if successful in whole or in part, shall be entitled to be paid the expense of prosecuting such claim. In any such action the Corporation shall have the burden of proving that the Indemnified Person is not entitled to the requested indemnification or advancement of expenses under applicable law.
          - heading [level=2] [ref=e751]:
            - generic [ref=e752]: "4."
            - text: Indemnification of Employees and Agents. The Corporation may indemnify and advance expenses to any person who was or is made or is threatened to be made or is otherwise involved in any Proceeding by reason of the fact that such person, or a person for whom such person is the legal representative, is or was an employee or agent of the Corporation or, while an employee or agent of the Corporation, is or was serving at the request of the Corporation as a director, officer, employee or agent of another corporation or of a partnership, joint venture, limited liability company, trust, enterprise or nonprofit entity, including service with respect to employee benefit plans, against all liability and loss suffered and expenses (including attorneys’ fees) reasonably incurred by such person in connection with such Proceeding. The ultimate determination of entitlement to indemnification of persons who are non-director or officer employees or agents shall be made in such manner as is determined by the Board of Directors in its sole discretion. Notwithstanding the foregoing sentence, the Corporation shall not be required to indemnify a person in connection with a Proceeding initiated by such person if the Proceeding was not authorized in advance by the Board of Directors.
          - heading "5. Advancement of Expenses of Employees and Agents. The Corporation may pay the expenses (including attorneys’ fees) incurred by an employee or agent in defending any Proceeding in advance of its final disposition on such terms and conditions as may be determined by the Board of Directors." [level=2] [ref=e753]:
            - generic [ref=e754]: "5."
            - text: Advancement of Expenses of Employees and Agents. The Corporation may pay the expenses (including attorneys’ fees) incurred by an employee or agent in defending any Proceeding in advance of its final disposition on such terms and conditions as may be determined by the Board of Directors.
          - heading "6. Non-Exclusivity of Rights. The rights conferred on any person by this Article Tenth shall not be exclusive of any other rights which such person may have or hereafter acquire under any statute, provision of this Certificate of Incorporation, the Bylaws of the Corporation, or any agreement, or pursuant to any vote of stockholders or disinterested directors or otherwise." [level=2] [ref=e755]:
            - generic [ref=e756]: "6."
            - text: Non-Exclusivity of Rights. The rights conferred on any person by this Article Tenth shall not be exclusive of any other rights which such person may have or hereafter acquire under any statute, provision of this Certificate of Incorporation, the Bylaws of the Corporation, or any agreement, or pursuant to any vote of stockholders or disinterested directors or otherwise.
          - heading "7. Other Indemnification. The Corporation’s obligation, if any, to indemnify any person who was or is serving at its request as a director, officer or employee of another corporation, partnership, limited liability company, joint venture, trust, organization or other enterprise shall be reduced by any amount such person may collect as indemnification from such other corporation, partnership, limited liability company, joint venture, trust, organization or other enterprise." [level=2] [ref=e757]:
            - generic [ref=e758]: "7."
            - text: Other Indemnification. The Corporation’s obligation, if any, to indemnify any person who was or is serving at its request as a director, officer or employee of another corporation, partnership, limited liability company, joint venture, trust, organization or other enterprise shall be reduced by any amount such person may collect as indemnification from such other corporation, partnership, limited liability company, joint venture, trust, organization or other enterprise.
          - 'heading "8. Insurance. The Board of Directors may, to the full extent permitted by applicable law as it presently exists, or may hereafter be amended from time to time, authorize an appropriate officer or officers to purchase and maintain at the Corporation’s expense insurance: (a) to indemnify the Corporation for any obligation which it incurs as a result of the indemnification of directors, officers and employees under the provisions of this Article Tenth; and (b) to indemnify or insure directors, officers and employees against liability in instances in which they may not otherwise be indemnified by the Corporation under the provisions of this Article Tenth." [level=2] [ref=e759]':
            - generic [ref=e760]: "8."
            - text: "Insurance. The Board of Directors may, to the full extent permitted by applicable law as it presently exists, or may hereafter be amended from time to time, authorize an appropriate officer or officers to purchase and maintain at the Corporation’s expense insurance: (a) to indemnify the Corporation for any obligation which it incurs as a result of the indemnification of directors, officers and employees under the provisions of this Article Tenth; and (b) to indemnify or insure directors, officers and employees against liability in instances in which they may not otherwise be indemnified by the Corporation under the provisions of this Article Tenth."
          - heading "9. Amendment or Repeal. Any repeal or modification of the foregoing provisions of this Article Tenth shall not adversely affect any right or protection hereunder of any person in respect of any act or omission occurring prior to the time of such repeal or modification. The rights provided hereunder shall inure to the benefit of any Indemnified Person and such person’s heirs, executors and administrators." [level=2] [ref=e761]:
            - generic [ref=e762]: "9."
            - text: Amendment or Repeal. Any repeal or modification of the foregoing provisions of this Article Tenth shall not adversely affect any right or protection hereunder of any person in respect of any act or omission occurring prior to the time of such repeal or modification. The rights provided hereunder shall inure to the benefit of any Indemnified Person and such person’s heirs, executors and administrators.
        - generic [ref=e763]:
          - separator [ref=e764]
          - list [ref=e765]:
            - listitem [ref=e766]:
              - paragraph [ref=e767]:
                - text: See Kumar v. Racing Corp. of Am., 1991 WL 67083 (Del. Ch. Apr. 26, 1991).
                - link "↩" [ref=e768] [cursor=pointer]:
                  - /url: "#fn-ref-2"
            - listitem [ref=e769]:
              - paragraph [ref=e770]:
                - text: Pursuant to Section 242 of the DGCL, a Delaware corporation “may amend its certificate of incorporation, from time to time, in any and as many respects as may be desired, so long as its certificate of incorporation as amended would contain only such provisions as it would be lawful and proper to insert in an original certificate of incorporation filed at the time of the filing of the amendment.” Section 242(b) of the DGCL sets forth the specific requirements that must be followed to properly effect an amendment. Section 245 of the DGCL further permits a Delaware corporation to restate its Certificate of Incorporation in order to “integrate into a single instrument all of the provisions of its certificate of incorporation which are then in effect and operative.” Section 245(c) of the DGCL requires that a restated Certificate of Incorporation shall be specifically designated as such in its heading.
                - link "↩" [ref=e772] [cursor=pointer]:
                  - /url: "#fn-ref-3"
            - listitem [ref=e773]:
              - paragraph [ref=e774]:
                - text: Section 245(c) of the DGCL requires that a restated Certificate of Incorporation state, either in its heading or in an introductory paragraph, the Corporation’s present name (and, if it has changed, the name under which it was originally incorporated) and the date the original Certificate of Incorporation was filed with the Secretary of State of Delaware.
                - link "↩" [ref=e776] [cursor=pointer]:
                  - /url: "#fn-ref-4"
            - listitem [ref=e777]:
              - paragraph [ref=e778]:
                - text: "If the Corporation has different types of Common Stock (such as A-B high and low vote, or Class F for founders, or otherwise), the number and type of those shares would need to be included here. If there are multiple types of Common Stock, consideration should be given to whether the different types of Common Stock are to be separate classes, or series of the same class. This can be important because the DGCL provides for default class voting for certain types of amendments, and whether the stock is a class or series will be relevant to whether they vote separately as a class or together with the other series of Common Stock on those amendments. Generally if a type of stock is named “Class __ Common Stock”, it will be viewed as a separate class, and not as a series, and thus have separate class voting rights on such amendments, unless there is very clear and unambiguous language indicating that, notwithstanding its name, it is a series. See Garfield v. Boxed, Inc., 2022 WL 17959766 (Del. Ch. Dec. 27, 2022) where the Court indicated that the Class A and Class B Common Stock were likely separate classes of stock and not series within a class and thus likely entitled to vote separately on an amendment increasing the authorized number of Class A Common Stock and eliminating the Class B Common Stock. An example of language intended to make clear that types of Common Stock named “Class __ Common Stock” are in fact series of the class of Common Stock is as follows: “The class of Common Stock shall be subdivided into two series consisting of ______ shares designated as Class A Common Stock, (the “Class A Common Stock”), and ______ shares designated as Class B Common Stock (the “Class B Common Stock”). For the avoidance of doubt, the Class A Common Stock and the Class B Common Stock are separate series within the class of Common Stock, and not separate classes of stock.” Also, even if the types of Common Stock are classes rather than series, the separate class vote on an amendment increasing or decreasing the number of authorized shares of a class can be eliminated by including the bracketed language in Section A.2 of this Article Fourth associated with footnote 8 below with respect to such class."
                - link "↩" [ref=e779] [cursor=pointer]:
                  - /url: "#fn-ref-5"
            - listitem [ref=e780]:
              - paragraph [ref=e781]: The number of authorized shares of Common Stock should be high enough to cover all outstanding shares of Common Stock, plus all shares of Common Stock issuable (i) upon exercise of outstanding options and all other uncommitted shares of stock available for grant under the stock plan pool, (ii) upon the conversion of shares of designated Preferred Stock, including, if applicable, accrued dividends, (iii) upon the exercise or conversion of all other securities exercisable for or convertible into Common Stock (e.g., warrants and convertible promissory notes), and (iv) within a reasonable time frame in respect of any compounding dividend, if applicable. Consideration should also be given to authorizing additional shares of Common Stock to permit the Board of Directors to issue such stock in connection with future events, such as acquisitions of other companies or businesses or in lending transactions. Note, however, that many venture capital investors will not permit the authorization of significant amounts of (or even any) additional shares of Common Stock.
              - paragraph [ref=e782]: The decision to select par or no par stock and, if par, what par value, has two consequences. First, as explained in more detail below, it affects the filing fee owed to the State of Delaware upon filing the Certificate of Incorporation. Second, in Delaware, the aggregate par value of the outstanding stock is subtracted from the net assets of the Corporation in determining the amount of the Corporation’s funds that are “surplus” lawfully available for the payment of dividends and the repurchase or redemption of stock. See Section 154 of the DGCL (setting forth how “surplus” is calculated), 170(a) (setting forth the sources of funds from which dividends may lawfully be paid), 160(a) (setting forth the sources of funds from which stock may lawfully be redeemed or repurchased). As discussed below, both of these consequences counsel in favor of assigning to stock a low par value (but not no par value). The concept of paid-in capital being an asset dedicated to protecting creditors has passed. Creditors no longer rely solely upon paid- in capital or upon the statutory restrictions upon dividends, redemptions, and other distributions to stockholders that “impair” capital to protect their interests. Instead, creditors negotiate and rely upon a wide variety of contractual arrangements to protect their interests, including, for example, loan covenants, security interests, and third-party guarantees. See generally Manning and Hanks, Legal Capital (3d Ed. 1990).
              - paragraph [ref=e783]: Corporations incorporated in Delaware are subject to fees for filing their certificates of incorporation and also are required to pay an annual franchise tax. Filing fees for a Certificate of Incorporation are calculated based on the number of authorized shares, and filing fees for an amendment increasing the number of authorized shares are calculated based on the increase in the number of authorized shares. There is no cap on filing fees. For purposes of computing the filing fee on par value stock, each $100 of authorized capital stock is counted as one taxable share. Accordingly, assigning a low par value to stock can result in a significant reduction in the filing fee. For example, the filing fee for 10,000 shares with a par value of one cent is the same as the filing fee for one share with a par value of $100. No par stock is assumed to be $100 par for this purpose. Accordingly, in order to minimize the filing fees, a low par value of one cent or less is recommended.
              - paragraph [ref=e784]:
                - text: In addition to the filing fees described above, Delaware corporations are required to pay an annual franchise tax which can be no lower than $175 per annum and no greater than $200,000 per annum (except in the case of certain public companies that qualify as a “large corporate filer” that are required to pay $250,000). Within this range, the franchise tax due is the lesser of the amount calculated either on the basis of number of authorized shares (currently $85 per 10,000 authorized shares) or on the basis of an alternative method which takes into account the Corporation’s gross assets and the ratio of its authorized to its issued shares; as a result, the greater the overhang, the greater the franchise tax under the alternative method. Unlike with the filing fee, the par value of the authorized stock does not generally affect the amount of the annual franchise tax owed under the authorized shares method. The tax is based on authorized shares, not only the number of shares that are issued and outstanding, and in the case of the alternative method, the percentage of the authorized shares that are actually issued (with a larger overhang resulting in a higher tax). Accordingly, it is advisable to consider the franchise taxes that will result from a particular capitalization before choosing it.
                - link "↩" [ref=e785] [cursor=pointer]:
                  - /url: "#fn-ref-6"
            - listitem [ref=e786]:
              - paragraph [ref=e787]:
                - text: This proviso is intended to ensure that, where an amendment to the Certificate of Incorporation (or a Certificate of Designations created pursuant to any “blank check” authority) affects only a series of Preferred Stock, such amendment may be approved by the holders of the affected series of Preferred Stock alone, without the necessity of approval by the holders of Common Stock. Section 212 of the DGCL states that, unless otherwise provided in the Certificate of Incorporation, each share of capital stock is entitled to one vote on all matters presented to stockholders for a vote. Any amendment to the Certificate of Incorporation must be effected in accordance with the procedure in Section 242 of the DGCL, which typically includes the vote of the holders of the Common Stock. Accordingly, it may be desirable to provide in the Certificate of Incorporation that only the holders of the affected series of Preferred Stock need vote on an amendment to the terms of such series. If this provision is not in the original Certificate of Incorporation, adding it will require a class vote of the Common Stock.
                - link "↩" [ref=e788] [cursor=pointer]:
                  - /url: "#fn-ref-7"
            - listitem [ref=e789]:
              - paragraph [ref=e790]:
                - text: "See the introductory notes regarding Section 2115 of the California Corporations Code. Alternative provision: “No person entitled to vote at an election for directors may cumulate votes to which such person is entitled, unless, at the time of such election, the Corporation is subject to Section 2115 of the California Corporations Code. During such time or times that the Corporation is subject to Section 2115(b) of the California Corporations Code, every stockholder entitled to vote at an election for directors may cumulate such stockholder’s votes and give one candidate a number of votes equal to the number of directors to be elected multiplied by the number of votes to which such stockholder’s shares are otherwise entitled, or distribute the stockholder’s votes on the same principle among as many candidates as such stockholder desires. No stockholder, however, shall be entitled to so cumulate such stockholder’s votes unless (i) the names of such candidate or candidates have been placed in nomination prior to the voting, and (ii) the stockholder has given notice at the meeting, prior to the voting, of such stockholder’s intention to cumulate such stockholder’s votes. If any stockholder has given proper notice to cumulate votes, all stockholders may cumulate their votes for any candidates who have been properly placed in nomination.” Under cumulative voting, the candidates receiving the highest number of votes, up to the number of directors to be elected, are elected."
                - link "↩" [ref=e791] [cursor=pointer]:
                  - /url: "#fn-ref-8"
            - listitem [ref=e792]:
              - paragraph [ref=e793]:
                - text: Including the final bracketed sentence requires the approval of the holders of Common Stock unless such provision was contained in the original Certificate of Incorporation. Without such a provision, the holders of the Common Stock effectively retain a class protective vote on subsequent equity financings if the number of authorized shares of Common Stock would need to be increased to accommodate the conversion rights of securities issued in such financings. Similar language should be considered vis-à-vis Preferred Stockholders if they are not intended to have a block on future financings. See also footnote 4.
                - link "↩" [ref=e794] [cursor=pointer]:
                  - /url: "#fn-ref-9"
            - listitem [ref=e795]:
              - paragraph [ref=e796]:
                - text: This model charter provides for three bracketed alternative dividend provisions. There are a variety of other alternatives that may be encountered in the marketplace, but the drafter should be able to easily adapt one of the three provisions to provide for whatever dividend terms are applicable to a particular transaction.
                - link "↩" [ref=e797] [cursor=pointer]:
                  - /url: "#fn-ref-10"
            - listitem [ref=e798]:
              - paragraph [ref=e799]:
                - text: The reason for this exclusion (and the comparable exclusion in the alternative dividend provisions that follow) is that such dividends are covered by the provisions of Section 4.6 which adjust the Conversion Price in the event of such a dividend.
                - link "↩" [ref=e800] [cursor=pointer]:
                  - /url: "#fn-ref-11"
            - listitem [ref=e801]:
              - paragraph [ref=e802]:
                - text: If the Corporation declares more than one Common Stock dividend in a given year, the Preferred Stock should not get two annual dividends in that year. Determining entitlement to dividends on a calendar year basis rather than on a rolling 12 month basis should be simpler.
                - link "↩" [ref=e803] [cursor=pointer]:
                  - /url: "#fn-ref-12"
            - listitem [ref=e804]:
              - paragraph [ref=e805]:
                - text: For simplicity, this model charter provides for pari passu dividends. If one series of Preferred Stock has a senior liquidation preference, this dividend language may need to be revised.
                - link "↩" [ref=e806] [cursor=pointer]:
                  - /url: "#fn-ref-13"
            - listitem [ref=e807]:
              - paragraph [ref=e808]:
                - text: "A cumulative dividend expressed as “$____ per share” will by definition be non-compounding. If a compounding accrued dividend is desired, it should be expressed as a percentage of a “base amount,” with the “base amount” defined as the original purchase price plus the amount of previously accrued dividends (it should also be specified whether this “compounding” of the original purchase price is done on an annual, quarterly, or other basis). As an example: “From and after the date of the issuance of any shares of Preferred Stock, dividends at the rate per annum of [8]% of the Original Issue Price (as defined below) of such share, plus the amount of previously accrued dividends, compounded annually, shall accrue on each share then outstanding (the “Accruing Dividends”).”"
                - link "↩" [ref=e809] [cursor=pointer]:
                  - /url: "#fn-ref-14"
            - listitem [ref=e810]:
              - paragraph [ref=e811]:
                - text: Insert the bracketed language if the holders of Preferred Stock will receive the benefit of the accruing dividends upon a liquidation event or upon redemption.
                - link "↩" [ref=e812] [cursor=pointer]:
                  - /url: "#fn-ref-15"
            - listitem [ref=e813]:
              - paragraph [ref=e814]:
                - text: The second bracketed alternative may not be sensible with respect to dividends paid on another series of Preferred Stock, particularly one which contains a reciprocal dividend provision, as it may result in an endless series of payments (as any payment with respect to one series would trigger a payment with respect to the other). This provision (and the similar provision in the first alternative dividend paragraph) are likely to be of little practicable import, as most venture capital-backed companies do not have the cash flow to make any dividend payments, and the negative covenants (contained in Section 3.3) prohibit dividend payments without the consent of some percentage of the holders of Preferred Stock.
                - link "↩" [ref=e815] [cursor=pointer]:
                  - /url: "#fn-ref-16"
            - listitem [ref=e816]:
              - paragraph [ref=e817]:
                - text: For simplicity, this model charter provides for pari passu preferred stock liquidation. If one or more series of preferred stock has a senior or junior liquidation preference, this language will need to be revised.
                - link "↩" [ref=e818] [cursor=pointer]:
                  - /url: "#fn-ref-17"
            - listitem [ref=e819]:
              - paragraph [ref=e820]:
                - text: "If accruing dividends are provided for, the following language would generally be used instead: “the Original Issue Price, plus any Accruing Dividends accrued but unpaid thereon, whether or not declared, together with any other dividends declared but unpaid thereon.”"
                - link "↩" [ref=e821] [cursor=pointer]:
                  - /url: "#fn-ref-18"
            - listitem [ref=e822]:
              - paragraph [ref=e823]: Where the Corporation has multiple series of Preferred Stock, the calculation of the Liquidation Amounts payable to each series becomes quite complicated. In determining whether the payment to the holders of any particular series of Preferred Stock would be maximized by the conversion of those shares into Common Stock, it is necessary to make an assumption as to which shares of Preferred Stock have converted into Common Stock. The most logical approach is to assume the conversion into Common Stock of all shares of each series of Preferred Stock that would receive a greater per share liquidation payment if converted into Common Stock than if remaining as Preferred Stock, and to provide, as presently drafted in this model charter, that this assumption shall apply in making the calculation required by this sentence. However, determining the amount provided for in clause (ii) of this sentence for any particular series of Preferred Stock requires you to calculate the Liquidation Amount for each other series of Preferred Stock (so you can calculate the amount available for distribution to the holders of Common Stock and the series of Preferred Stock in question); and calculating the Liquidation Amount for each such other series itself involves a determination of whether the original purchase price for such other series of Preferred Stock (plus dividends, if applicable) exceeds the amount payable with respect to such series on an as-converted basis – and this latter amount cannot be calculated without knowing what the Liquidation Amounts are for all other series of Preferred Stock. If the various series of Preferred Stock are not pari passu, these calculations become even more difficult.
              - paragraph [ref=e824]: Some versions of Preferred Stock terms simply state that the liquidation payment to be made to a particular series of Preferred Stock is equal to the original purchase price of such Preferred Stock (plus accrued but unpaid dividends, if applicable) rather than the higher of such amount and the as-converted payment. That alternative formulation is not intended to result in a substantive difference from the approach taken in this form; rather, in that alternative formulation, it is assumed that the holders of a particular series of Preferred Stock would simply convert into Common Stock if the as-converted payment is greater than the original purchase price (plus dividends, if applicable). While such alternative formulation avoids the drafting complexities described in the preceding paragraph, it simply shifts those complexities to the decision each individual holder of Preferred Stock must make at the time of a liquidation event. That is, each holder of Preferred Stock must decide whether it will receive a higher payment if it converts into Common Stock; and such determination would require each holder of Preferred Stock to make an assumption as to whether the other holders of Preferred Stock (both of the same series and of different series) will convert into Common Stock. However, it is sometimes impossible to know at the time of the closing whether conversion is beneficial.
              - paragraph [ref=e825]:
                - text: This issue is not applicable to participating Preferred Stock without a cap on the liquidation preference – because participating Preferred Stock entitles its holder to receive both the basic liquidation payment and the as-converted payment, there is no need to determine whether the basic payment or the as-converted payment is greater.
                - link "↩" [ref=e826] [cursor=pointer]:
                  - /url: "#fn-ref-19"
            - listitem [ref=e827]:
              - paragraph [ref=e828]:
                - text: "If accruing dividends are provided for, the following language would generally be used instead: “the Original Issue Price, plus any Accruing Dividends accrued but unpaid thereon, whether or not declared, together with any other dividends declared but unpaid thereon.”"
                - link "↩" [ref=e829] [cursor=pointer]:
                  - /url: "#fn-ref-20"
            - listitem [ref=e830]:
              - paragraph [ref=e831]:
                - text: "If a cap to the liquidation preference is specified in the term sheet, add the following language at the end of this sentence: “; provided, however, that if the aggregate amount which the holders of Preferred Stock are entitled to receive under Sections 2.1 and 2.2 shall exceed [$_______] per share (subject to appropriate adjustment in the event of a stock split, stock dividend, combination, reclassification, or similar event affecting the Preferred Stock) (the “Maximum Participation Amount”), each holder of Preferred Stock shall be entitled to receive upon such liquidation, dissolution or winding up of the Corporation the greater of (i) the Maximum Participation Amount and (ii) the amount such holder would have received if all shares of Preferred Stock had been converted into Common Stock immediately prior to such liquidation, dissolution or winding up of the Corporation.”"
                - link "↩" [ref=e832] [cursor=pointer]:
                  - /url: "#fn-ref-21"
            - listitem [ref=e833]:
              - paragraph [ref=e834]:
                - text: It is generally inadvisable to insert language that includes a transfer of shares by stockholders as a Deemed Liquidation Event, as such transactions may not be within the control of the Corporation and, in any event, could be inadvertently triggered with unintended consequences. A better practice is to protect against such events through a combination of other measures, including protective provisions regarding the issuance of stock and rights of first refusal over transfers of stock by other stockholders. Counsel should be aware, however, that protective provisions and rights of first refusal may not be sufficient to protect against all eventualities, particularly given that many venture capital investors refuse to subject their own shares to transfer restrictions such as a right of first refusal.
                - link "↩" [ref=e835] [cursor=pointer]:
                  - /url: "#fn-ref-22"
            - listitem [ref=e836]:
              - paragraph [ref=e837]:
                - text: The vote required to waive the treatment of a particular transaction as a Deemed Liquidation Event is generally the same vote that would be required to amend this provision under the terms of Section 3.3. Drafters should take care when defining a voting threshold that includes multiple classes or series of stock and consider the potential of impact of anti-dilution adjustments, which can change the respective voting powers of the different classes or series. Waiver of treatment of a transaction as a Deemed Liquidation Event means that the Preferred Stock has waived its right to be treated in a manner superior to the Common Stock in such Deemed Liquidation Event.
                - link "↩" [ref=e838] [cursor=pointer]:
                  - /url: "#fn-ref-23"
            - listitem [ref=e839]:
              - paragraph [ref=e840]:
                - text: If the Preferred Stock is willing to forgo some but not all of its preference in such Deemed Liquidation Event, the Certificate of Incorporation should be amended prior to the effective time of the Deemed Liquidation Event to fix the agreed upon preference in connection with such Deemed Liquidation Event.
                - link "↩" [ref=e841] [cursor=pointer]:
                  - /url: "#fn-ref-24"
            - listitem [ref=e842]:
              - paragraph [ref=e843]:
                - text: The “as-converted basis” language takes into account any anti-dilution adjustments. If the intention is to set the voting threshold differently, the drafter should take care to make appropriate adjustments to the language, particularly where the Corporation has multiple classes or series of preferred stock.
                - link "↩" [ref=e844] [cursor=pointer]:
                  - /url: "#fn-ref-25"
            - listitem [ref=e845]:
              - paragraph [ref=e846]:
                - text: "*New October 2025* This draft has been revised to clarify that “transfer” in this context means a transfer of the Corporation and does not mean a transfer of capital stock or other equity securities of the Corporation. See Sections 265, 266 and 390 of the DGCL."
                - link "↩" [ref=e848] [cursor=pointer]:
                  - /url: "#fn-ref-26"
            - listitem [ref=e849]:
              - paragraph [ref=e850]:
                - text: The DGCL was amended effective August 1, 2022 to change the vote required for a statutory conversion of a Delaware corporation, and effective August 1, 2023 to change the vote required for a transfer of a corporation, domestication or continuance of a Delaware corporation from a unanimous vote to a majority vote. Because statutory conversions, transfers of a corporation, domestications and continuances can have the same effect on preferred stockholders as a merger, they have been added as Deemed Liquidation Events. The word “merger” in a protective provision in a Certificate of Incorporation adopted prior to August 1, 2022 will be deemed to apply to statutory conversions, and in a Certificate of Incorporation adopted prior to August 1, 2023 will be deemed to apply to transfers, domestications and continuances. If the Corporation is incorporated in a state whose corporate statute provides for statutory share exchanges (Delaware currently does not), a share exchange or division transaction should also be added to the list of transactions constituting a Deemed Liquidation Event in this Section 2.3.1(a), as well as in Section 2.3.2(a) below.
                - link "↩" [ref=e851] [cursor=pointer]:
                  - /url: "#fn-ref-27"
            - listitem [ref=e852]:
              - paragraph [ref=e853]:
                - text: Basing this provision on voting power permits a transaction in which a majority of the economic capital stock is transferred without triggering a Deemed Liquidation Event.
                - link "↩" [ref=e854] [cursor=pointer]:
                  - /url: "#fn-ref-28"
            - listitem [ref=e855]:
              - paragraph [ref=e856]:
                - text: In certain circumstances the business of the Corporation may be sold in an asset sale with certain material assets, such as intellectual property assets, excluded from the transaction. Depending on the relative value of the excluded assets, the transaction might not rise to the standard of “all or substantially all” of the assets even though the business has been sold as a going concern. In order to avoid uncertainty as to whether this type of transaction constitutes a “Deemed Liquidation Event,” the operative language could be modified to read “all or substantially all of the business or assets of the Corporation”.
                - link "↩" [ref=e857] [cursor=pointer]:
                  - /url: "#fn-ref-29"
            - listitem [ref=e858]:
              - paragraph [ref=e859]:
                - text: "*New October 2025* This draft has been revised to clarify that a “pure” equity financing is not a Deemed Liquidation Event (which is the intent of prior versions of this model document, but has resulted in questions over time)."
                - link "↩" [ref=e860] [cursor=pointer]:
                  - /url: "#fn-ref-30"
            - listitem [ref=e861]:
              - paragraph [ref=e862]:
                - text: Investor counsel may seek to add further investor protection by providing that, if a specified percentage of the Series A holders object to the valuation, then the value shall be the fair market value as mutually determined by the Corporation and the specified Series A holders, and if the Corporation and those Series A holders are unable to reach agreement, then fair market value shall be established by an independent appraisal. If such a provision is used, the procedural details (e.g., how appraiser is to be selected, who pays, is the appraisal binding, etc.) should be spelled out.
                - link "↩" [ref=e863] [cursor=pointer]:
                  - /url: "#fn-ref-31"
            - listitem [ref=e864]:
              - paragraph [ref=e865]: "This section addresses two related issues that may arise when a venture-capital backed company is acquired in a merger: (1) the allocation of earn-out or performance-based consideration, if any and (2) how any deductions from the merger consideration to fund an indemnity escrow or holdback are allocated among the holders of capital stock of the Corporation. This provision is designed to address both issues, with optional language regarding the treatment of escrow."
              - paragraph [ref=e866]: In transactions involving earn-out or performance-based consideration, one approach is to allocate the closing proceeds in accordance with the liquidation provisions of the Certificate of Incorporation as if such closing proceeds were the only amounts payable in the transaction. If, subsequent to the closing of the transaction, any additional payments are made upon satisfaction of earn-out or performance-based contingencies, the liquidation provisions would be re-applied to ensure that the aggregate consideration is allocated as it would have been as if the closing and post-closing payments were made at a single time. Alternatively, in a transaction where the closing proceeds were less than the aggregate liquidation preference of the Preferred Stock and potential earn-out payments were of sufficient size as to result in full conversion of all Preferred Stock (assuming such Preferred Stock was not fully participating) and all proceeds shared pro rata on an as-converted basis, it has occasionally been argued that in the absence of explicit language to the contrary, the holders of Preferred Stock must choose to either be paid their liquidation preference from the closing proceeds and forgo any as-converted based participation in the earn-out, or convert into Common Stock prior to the closing and thereby waive any liquidation preference in order to preserve the ability to participate in the distribution of earn-out proceeds on an as-converted basis. Given the consensus view that such alternative is inconsistent with the bargain implicit in a preferred security, this Section 2.3.4 makes it clear that the “greater of preference or participation” character of Preferred Stock survives in transaction involving contingent consideration.
              - paragraph [ref=e867]: With respect to the allocation of amounts placed in escrow or subject to holdback to be available for the satisfaction of indemnity obligations, Section 2.3.4 contains optional language that permits such amounts to either be treated as “Initial Consideration” and paid with the closing proceeds and withheld on a pro rata basis from all stockholders, or instead treated as “Additional Consideration” (e.g., a separate contingent payment), which results in the holders of Preferred Stock always receiving their liquidation preference, even if some or all of the escrow is forfeited (see further discussion on this point below). If escrowed amounts are to be treated as “Initial Consideration,” the parties may wish to consider whether future earn-out payments in such transaction should take into account whether any portion of such escrow amounts have been paid to the buyer or other third parties prior to the time such earn-out payments are made – e.g., whether the earn-out should “backfill” any escrow dollars applied as liquidation preference but not eventually paid.
              - paragraph [ref=e868]: "From the perspective of the holders of Preferred Stock, the pro rata approach resulting from treating the escrowed amount as “Initial Consideration” may not give them the full benefit of their bargained-for liquidation preference because if not all of the escrow is ultimately released to the corporation’s stockholders, it can result in the Preferred Stock holders receiving less, and the Common Stock holders receiving more, than they would have been entitled to receive if the reduced consideration had been allocated in the manner provided for in the Certificate of Incorporation. The difference between the two approaches is illustrated by the following example:"
              - paragraph [ref=e869]:
                - generic [ref=e870]: •
                - text: 100 shares of Preferred Stock and 100 shares of Common Stock are outstanding;
              - paragraph [ref=e871]:
                - generic [ref=e872]: •
                - text: the Preferred Stock has a liquidation preference of $1.00 per share, and is non-participating;
              - paragraph [ref=e873]:
                - generic [ref=e874]: •
                - text: the purchase price for the Corporation is $150; and
              - paragraph [ref=e875]:
                - generic [ref=e876]: •
                - text: $15 is placed in escrow, which ultimately is returned to the acquirer (such the actual purchase price turns out to be $135.
              - paragraph [ref=e877]: If the escrow were allocated among all stockholders pro rata, the initial $135 payment would be allocated $90 to the holders of Preferred Stock and $45 to the holders of Common Stock; and the escrow would be allocated $10 to the holders of Preferred Stock and $5 to the holders of Common Stock. If the escrow were later paid to the stockholders, the $150 purchase price would be allocated as the Certificate of Incorporation provides – $100 to the Preferred Stock holders and $50 to the Common holders. On the other hand, if the $15 escrow were forfeited, the $135 purchase price would be allocated $90 to the Preferred Stock holders and $45 to the Common holders. However, according to the liquidation provisions of the Certificate of Incorporation, a purchase price of 135 should be allocated $100 to the holders of Preferred Stock and $35 to the holders of Common Stock. Thus this pro rata allocation of the escrow could provide a smaller payout to the Preferred Stock holders than would be the result if the liquidation provisions of the Certificate of Incorporation were applied to the reduced purchase price (after deducting the forfeited escrow proceeds).
              - paragraph [ref=e878]: Deeming the escrowed consideration as “Additional Consideration” ensures that the Preferred Stock holders always receive their liquidation preference, even if some or all of the escrow is forfeited – the initial payment of $135 would be allocated $100 to the Preferred Stock holders and $35 to the Common holders, and all $15 of the escrow would be allocated to the Common holders (with any proceeds released from escrow also going solely to the Common holders). Whether the escrow is forfeited or paid to the holders of Common Stock, the result would be an allocation that is consistent with how the Certificate of Incorporation would allocate whatever the ultimate purchase price turns out to be.
              - paragraph [ref=e879]:
                - text: If the Certificate of Incorporation is silent on allocation of escrow and contingent consideration, at the time of an acquisition the Corporation’s Board of Directors will have to approve allocations without the benefit of a Certificate of Incorporation provision stipulating how that should be done. This could create the risk that some constituency will have grounds to complain about the Board’s decision, including a claim that the terms of the merger agreement are inconsistent with the liquidation provisions of the Certificate of Incorporation addressing how merger consideration must be allocated among the various series and classes of stock of the Corporation.
                - link "↩" [ref=e880] [cursor=pointer]:
                  - /url: "#fn-ref-32"
            - listitem [ref=e881]:
              - paragraph [ref=e882]:
                - text: While the size of the Board of Directors could be set forth in the charter, it is typically determined as provided in (or, occasionally, fixed in) the bylaws (permitting the authorized size of the Board to be changed without the need for a charter amendment, but subject to protective provisions). When setting the board size for early-stage companies, it is important to consider the quorum requirements of Section 141(b) of the DGCL which generally provides that a quorum is a majority of the total number of directors, unless the Certificate of Incorporation or bylaws provide that a greater or lesser percentage (but not less than 1/3 of the total number) of directors constitutes a quorum. Thus, if a company is formed and its initial bylaws provide for three directors, but only one director is initially appointed, that director alone would not constitute a quorum and could not take valid board action (other than filling the vacancies) unless the bylaws also provided that 1/3 of the total number of directors constitutes a quorum. Accordingly, it is recommended that the bylaws provide for a quorum to be a majority of then-seated directors or, if greater, 1/3 of the authorized number of directors.
                - link "↩" [ref=e883] [cursor=pointer]:
                  - /url: "#fn-ref-33"
            - listitem [ref=e884]:
              - paragraph [ref=e885]:
                - text: Where a class or series is given the right to elect a director in the Certificate of Incorporation and the language in Section 3.2(c)(i) is included, such director may only be properly elected to the Board of Directors by that class or series. See footnote 34.
                - link "↩" [ref=e886] [cursor=pointer]:
                  - /url: "#fn-ref-34"
            - listitem [ref=e887]:
              - paragraph [ref=e888]:
                - text: This provision works in conjunction with the Voting Agreement to address issues raised by FGC Holdings Ltd. v. Teltronics, Inc., 2005 WL 2334357 (Del. Ch. Sept. 14, 2005) and is intended to protect parties who have specific designation rights under this model charter by requiring such seats to be filled only by vote of stockholders who are entitled to vote thereon (and then the Voting Agreement governs how bound stockholders vote).
                - link "↩" [ref=e889] [cursor=pointer]:
                  - /url: "#fn-ref-35"
            - listitem [ref=e890]:
              - paragraph [ref=e891]:
                - text: Where a class or series is given the right to elect a director in the Certificate of Incorporation, Delaware law provides that the removal of that director other than for cause must be effected by the vote of the stockholders of the applicable class or series and not by the stockholders generally. Likewise, it is important to replace any such director by either (i) the vote of the stockholders of the applicable class or series or (ii) if the class or series is given the right to elect multiple directors, the remaining director(s) elected by such class or series.
                - link "↩" [ref=e892] [cursor=pointer]:
                  - /url: "#fn-ref-36"
            - listitem [ref=e893]:
              - paragraph [ref=e894]:
                - text: This model provision simplifies (relative to prior models) some of the preferred director votes that have been expanded in this model charter. Drafters may also consider setting up different thresholds for different board-level votes set forth in this model charter.
                - link "↩" [ref=e895] [cursor=pointer]:
                  - /url: "#fn-ref-37"
            - listitem [ref=e896]:
              - paragraph [ref=e897]:
                - text: The preamble to Section 3.3 in this model charter is drafted to be clear that the stockholder consent is required to effect the listed acts and that predicate actions, such as prior board approval, do not violate the protective provision.
                - link "↩" [ref=e898] [cursor=pointer]:
                  - /url: "#fn-ref-38"
            - listitem [ref=e899]:
              - paragraph [ref=e900]:
                - text: The bracketed language is included to address the Delaware Chancery Court’s opinion in Fletcher Int’l, Ltd. v. ION Geophysical Corp., 2010 WL 1223782 (Del. Ch. Mar. 24, 2010), where the court declined to unwind promissory notes issued by the defendant corporation in violation of a preferred stock consent right in its charter. Rather than declaring the issuance void and ordering the transaction to be rescinded, the court determined that there was no irreparable harm to the plaintiff because monetary damages would provide it with an adequate remedy under the circumstances, and, in balancing the potential harms to the parties, concluded that the harm to the corporation from voiding the note issuance and potentially causing the insolvency of the corporation exceeded the harm to the investor who could be compensated with money damages. Subsequent cases in Delaware have declined to apply this kind of equitable balancing where the applicable provision indicates the parties’ agreement that action taken in violation of such provision will be “null and void ab initio”. See, e.g. Southpaw Credit Opportunity Master Fund, L.P., v. Roma Rest. Holdings, Inc., 2018 WL 658734 (Del. Ch. Feb. 1, 2018) (declining to consider equitable defenses in finding void ab initio a stock transfer in violation of a stockholders agreement that provided transfers effected without a joinder were void ab initio) and Holifield v. XRI Inv. Holdings LLC, 2023 WL 5761367 (Del. Sept 7, 2023) (finding that use of the word “void” in a limited liability company agreement in respect of certain purported transfers of member interests rendered such transfers “incurably void” such that affirmative defenses did not apply, but noting that DGCL Section 204 and an analogous provision in Delaware’s Limited Liability Company Act provide a mechanism for corporations and LLCs to ratify defective or “void” corporate acts ).
                - link "↩" [ref=e901] [cursor=pointer]:
                  - /url: "#fn-ref-39"
            - listitem [ref=e902]:
              - paragraph [ref=e903]:
                - text: This model charter does not include “or consent to any of the foregoing” (which was in the 2020 version of the model charter but removed in 2023) because the “consent to the foregoing” language created ambiguity in situations where board approval is necessary before seeking stockholder approval.
                - link "↩" [ref=e904] [cursor=pointer]:
                  - /url: "#fn-ref-40"
            - listitem [ref=e905]:
              - paragraph [ref=e906]:
                - text: "*New October 2025* If Investors desire to have a block over the Corporation moving to a different jurisdiction, build in a separate protective provision."
                - link "↩" [ref=e908] [cursor=pointer]:
                  - /url: "#fn-ref-41"
            - listitem [ref=e909]:
              - paragraph [ref=e910]:
                - text: If the parties desire a protective provision over the issuance of Convertible Securities the language could read “create any capital stock unless the same ranks junior to [or pari passu with] the Preferred Stock with respect to its special rights, powers and preferences, or issue any Convertible Security that may convert into capital stock unless the capital stock potentially issuable upon such conversion would rank junior to [or pari passu with] the Preferred Stock with respect to its special rights, powers and preferences.”
                - link "↩" [ref=e911] [cursor=pointer]:
                  - /url: "#fn-ref-42"
            - listitem [ref=e912]:
              - paragraph [ref=e913]:
                - text: If there are multiple types of Common Stock, see footnote 4, consider whether the defined term does or should include all of them.
                - link "↩" [ref=e914] [cursor=pointer]:
                  - /url: "#fn-ref-43"
            - listitem [ref=e915]:
              - paragraph [ref=e916]:
                - text: Under Delaware law, absent a specific protective provision, the authorization of another series of Preferred Stock with rights senior or pari passu to those of the existing Preferred Stock as to dividends, liquidation and redemption would generally not constitute an amendment that adversely affects the rights, powers and preferences of the existing Preferred Stock. Accordingly, Section 3.3.4 contains additional restrictions specifically dealing with the authorization of senior or pari passu stock.
                - link "↩" [ref=e917] [cursor=pointer]:
                  - /url: "#fn-ref-44"
            - listitem [ref=e918]:
              - paragraph [ref=e919]:
                - text: "*Revised October 2025* Inclusion of an exception to the stockholder vote if approval by one or more Preferred Directors is obtained is frequently seen as a compromise between strictly requiring approval of the holders of Preferred Stock (qua-stockholders) and simply requiring Board approval. The list of provisions under this Subsection 3.3.9 is customizable to address transactions about which the holders of Preferred Stock have specific concerns, and some or all may be appropriate to include either under this Subsection 3.3.9 or as standalone subsections under Section 3.3, or even moved to or remain in the Investors’ Rights Agreement. Many of these were previously in Section 5 of prior versions of the model Investors’ Rights Agreement and others were previously individual subsections of Section 3.3 that were moved here into one Subsection 3.3.9 to consolidate all provisions that permit heightened board approval as an alternative to Preferred stockholder approval. Moving the provisions that were previously in the model Investors’ Rights Agreement to the model charter makes it easier to compare and move provisions that require the protective stockholder vote versus those that permit the board approval alternative. Please note that consolidation of these provisions into the model charter does not indicate that such provisions cannot be moved to or remain in the Investors’ Rights Agreement, but does potentially (i) mitigate some ambiguities about the interplay between Sections 122(18) and 141(d) of the DGCL and (ii) increase the likelihood an injunction/specific enforcement could be obtained in the event of breach."
                - link "↩" [ref=e920] [cursor=pointer]:
                  - /url: "#fn-ref-45"
            - listitem [ref=e921]:
              - paragraph [ref=e922]:
                - text: The dollar value here should reflect the stage/size of the company and its customary agreements.
                - link "↩" [ref=e923] [cursor=pointer]:
                  - /url: "#fn-ref-46"
            - listitem [ref=e924]:
              - paragraph [ref=e925]:
                - text: The effect of using the Original Issue Price is that accruing dividends are not taken into account in a conversion.
                - link "↩" [ref=e926] [cursor=pointer]:
                  - /url: "#fn-ref-47"
            - listitem [ref=e927]:
              - paragraph [ref=e928]:
                - text: If a “pay-to-play” is implemented/contemplated, consider blocking optional conversion during its pendency with language such as this bracketed provision. This is also applicable where the pay-to-play relates to tranches in a financing where later tranches are mandatory. Because the voting rights of the Preferred stock and its rights to proceeds in the event of a liquidation, dissolution, winding up, or Deemed Liquidation Event flow from its optional conversion rights under Section 4.1, the last proviso is important to avoid ambiguity over the status of those rights during any period in which optional conversion rights are suspended. Careful attention should be paid to update and use appropriate defined terms that apply in the specific circumstances.
                - link "↩" [ref=e930] [cursor=pointer]:
                  - /url: "#fn-ref-48"
            - listitem [ref=e931]:
              - paragraph [ref=e932]:
                - text: To be consistent with this model charter, a Corporation’s capitalization table management system must match how the charter calculates as-converted shares (for example, some platforms do this on a certificate basis, whereas the default language in this document is on a holder basis), the capitalization table may have to be updated manually to reflect such calculations. The language in Section 4.2 has been revised to clarify that the number of shares issuable upon conversion will be the nearest whole number and no fractional interests will be created.
                - link "↩" [ref=e933] [cursor=pointer]:
                  - /url: "#fn-ref-49"
            - listitem [ref=e934]:
              - paragraph [ref=e935]:
                - text: "For uncertificated shares of Common Stock, use the following for (i): “issue and deliver to such holder of Preferred Stock, or to such holder’s nominees, a notice of issuance of uncertificated shares and may, upon written request, issue and deliver a certificate for the number of full shares of Common Stock issuable upon such conversion in accordance with the provisions hereof and, may, if applicable and upon written request, issue and deliver a certificate for the number (if any) of the shares of Preferred Stock represented by any surrendered certificate that were not converted into Common Stock”."
                - link "↩" [ref=e936] [cursor=pointer]:
                  - /url: "#fn-ref-50"
            - listitem [ref=e937]:
              - paragraph [ref=e938]:
                - text: Some investors will insist that, upon conversion, all declared but unpaid dividends (and, if the Preferred Stock is entitled to accruing dividends, all accrued dividends, whether or not declared) be paid in additional shares of Common Stock rather than in cash. Assuming that the Preferred Stock is “preferred stock” for purposes of Section 305 of the Internal Revenue Code, the issuance of additional shares of Common Stock in payment of accrued but unpaid dividends will likely be deemed to be a taxable stock dividend to the extent of the Corporation’s current and accumulated earnings and profits.
                - link "↩" [ref=e939] [cursor=pointer]:
                  - /url: "#fn-ref-51"
            - listitem [ref=e940]:
              - paragraph [ref=e941]:
                - text: If there are multiple types of Common Stock, see footnote 4, consider whether the defined term does or should include all of them.
                - link "↩" [ref=e942] [cursor=pointer]:
                  - /url: "#fn-ref-52"
            - listitem [ref=e943]:
              - paragraph [ref=e944]:
                - text: Some investors would prefer to include a hard cap on the number of shares issuable under equity incentive plans that do not trigger anti-dilution adjustments. Stock or options reserved for issuance prior to the Original Issue Date ordinarily should not require special approval.
                - link "↩" [ref=e945] [cursor=pointer]:
                  - /url: "#fn-ref-53"
            - listitem [ref=e946]:
              - paragraph [ref=e947]:
                - text: Should tie to the most recent series of Preferred.
                - link "↩" [ref=e948] [cursor=pointer]:
                  - /url: "#fn-ref-54"
            - listitem [ref=e949]:
              - paragraph [ref=e950]:
                - text: The reason for this parenthetical is that an automatic change in another security pursuant to its anti-dilution provisions would cause an automatic adjustment pursuant to this provision. If the adjustment pursuant to this provision then causes another automatic change in the other security, it is possible that the second change in the other security can cause a second change pursuant to this provision, which causes a third change to the other security and then a third adjustment pursuant to this provision, and on and on. This form does not provide for adjustment to the Conversion Price as a result of anti-dilution adjustments to the terms of Options or Convertible Securities, because of the complexity involved in such calculations, and because the dilutive event triggering the adjustment to the terms of the Option or Convertible Security would presumably also trigger an adjustment to the Conversion Price under the terms Section 4.4.4 (thus obviating the need to provide for an adjustment to the Conversion Price as a result of an anti-dilution adjustment to the terms of the Option or Convertible Security).
                - link "↩" [ref=e951] [cursor=pointer]:
                  - /url: "#fn-ref-55"
            - listitem [ref=e952]:
              - paragraph [ref=e953]:
                - text: See footnote 54 for an explanation of this parenthetical.
                - link "↩" [ref=e954] [cursor=pointer]:
                  - /url: "#fn-ref-56"
            - listitem [ref=e955]:
              - paragraph [ref=e956]:
                - text: This Section represents a typical “broad-based weighted average” anti-dilution provision. Broad-based anti-dilution is more founder-friendly than a “narrow-based” anti-dilution formula. Whether an anti-dilution provision is broad or narrow is determined by how broad or narrow is the formula (set forth in clause (c) of this Section) for calculating the number of outstanding shares of Common Stock. An even broader formula would include in that calculation all shares reserved under stock plans, whether or not subject to outstanding options (on the theory that those shares are generally included when translating the “pre-money valuation” agreed between the Corporation and the investors to a per share purchase price for the financing). In contrast, a narrower formula might include in the calculation of outstanding shares only those shares of Common Stock that are actually outstanding (i.e., excluding shares of Common Stock issuable on conversion of options, warrants and, potentially, even the Preferred Stock itself). While narrow-based anti-dilution formulas are more investor-friendly, the most investor-friendly category of anti-dilution protection is a “full ratchet” anti-dilution.
                - link "↩" [ref=e957] [cursor=pointer]:
                  - /url: "#fn-ref-57"
            - listitem [ref=e958]:
              - paragraph [ref=e959]:
                - text: Occasionally, a ratchet antidilution provision such as this model provision is time limited and, after a date certain, broad-based weighted average antidilution applies. If you specify a date certain here, be sure to include appropriate provision for what happens after that date.
                - link "↩" [ref=e960] [cursor=pointer]:
                  - /url: "#fn-ref-58"
            - listitem [ref=e961]:
              - paragraph [ref=e962]:
                - text: This Section and the Sections that follow do not provide for any adjustment to the Conversion Price in the event of stock splits, etc. affecting the Preferred Stock, because those adjustments are covered by the definition of Original Issue Price, which automatically adjusts the numerator of the conversion ratio.
                - link "↩" [ref=e963] [cursor=pointer]:
                  - /url: "#fn-ref-59"
            - listitem [ref=e964]:
              - paragraph [ref=e965]:
                - text: "Alternative provision: add the following after “in each such event” in place of the current text – “provision shall be made so that the holders of the Preferred Stock shall receive upon conversion thereof, in addition to the number of shares of Common Stock receivable thereupon, the kind and amount of securities of the Corporation, cash or other property which they would have been entitled to receive had the Preferred Stock been converted into Common Stock on the date of such event and had they thereafter, during the period from the date of such event to and including the conversion date, retained such securities receivable by them as aforesaid during such period, giving application to all adjustments called for during such period under this paragraph with respect to the rights of the holders of the Preferred Stock; provided, however, that no such provision shall be made if the holders of Preferred Stock receive, simultaneously with the distribution to the holders of Common Stock, a dividend or other distribution of such securities, cash or other property in an amount equal to the amount of such securities, cash or other property as they would have received if all outstanding shares of Preferred Stock had been converted into Common Stock on the date of such event.”"
                - link "↩" [ref=e966] [cursor=pointer]:
                  - /url: "#fn-ref-60"
            - listitem [ref=e967]:
              - paragraph [ref=e968]:
                - text: In several Delaware cases involving mergers that were not treated as a liquidation under the Certificate of Incorporation, the Court of Chancery construed anti-destruction language of the type found in Section 4.8 as capping the value of the Preferred Stock in an appraisal proceeding because the conversion rights of the preferred were the only contractual rights of the preferred stock implicated by the merger in question and thus were the only contractual basis to distinguish the appraisal value of the preferred stock from that of the common stock in the merger in question. See In re Appraisal of Metromedia Int’l Grp., Inc., 971 A.2d 893 (Del. Ch. 2009). This circumstance only comes up in a situation where the merger in question is not treated as a liquidation event under the charter but an investor nonetheless seeks to pursue appraisal rights in such merger as a cash exit from its investment. In an appraisal, the Preferred Stock and Common Stock will be treated the same absent express language in the charter defining the rights of the preferred stock. Anti-destruction provisions such as those above focus on the conversion rights of the Preferred Stock. An appraisal, by contrast, could theoretically account for the liquidation, dividend, redemption and other preferences of the Preferred Stock; however, absent clear language indicating how these preferences are to be taken into account in a merger, courts in Delaware have considered the possibility of such payments to be speculative and not part of the going concern value of the Preferred Stock. In this model charter many mergers are treated as liquidations, which is the best way to address this issue. In the case of a merger that does not trigger payment of the liquidation preference, investors should focus on what mergers will not be treated as liquidations and consider whether the types of mergers which are treated as liquidations should be expanded or whether other provision should be made (e.g., redemption, dividend acceleration) to capture the preferences of the Preferred Stock in a merger which is not treated as a liquidation under this model charter.
                - link "↩" [ref=e969] [cursor=pointer]:
                  - /url: "#fn-ref-61"
            - listitem [ref=e970]:
              - paragraph [ref=e971]:
                - text: This would not include the creation of a public trading market for the Corporation’s shares by direct listing, but that Requisite Holders have the ability to consent to conversion in that instance.
                - link "↩" [ref=e972] [cursor=pointer]:
                  - /url: "#fn-ref-62"
            - listitem [ref=e973]:
              - paragraph [ref=e974]:
                - text: In the context of a Series A financing, this value can be set as an amount equal to three to five times the post-money valuation of the Corporation in the financing, which would be equivalent to setting the minimum price per share for the Qualified IPO to be three to five times the Series A purchase price.
                - link "↩" [ref=e975] [cursor=pointer]:
                  - /url: "#fn-ref-63"
            - listitem [ref=e976]:
              - paragraph [ref=e977]:
                - text: There have been some requests to include sample language for direct listings in this model chart, so the bracketed proposed language has been included.
                - link "↩" [ref=e978] [cursor=pointer]:
                  - /url: "#fn-ref-64"
            - listitem [ref=e979]:
              - paragraph [ref=e980]:
                - text: As with the vote required to waive a Deemed Liquidation Event, see footnote 22, where there are multiple series of Preferred Stock, investors should give consideration to the vote required to trigger a mandatory conversion. See Greenmont Cap. Partners I, LP v. Mary’s Gone Crackers, Inc., 2012 WL 4479999 (Del. Ch. Sept. 28, 2012) in which plaintiff, whose series of preferred stock did not have a blocking vote on mandatory conversion, unsuccessfully argued that its consent right on actions that would “alter or change” its series rights prevented the majority of preferred holders from converting all preferred stock to common stock. See also Alta Berkeley VI C.V. v. Omneon, Inc., 41 A.3d 381 (Del. 2012) in which plaintiff, who did not have a blocking vote on mandatory conversion, unsuccessfully argued that it was entitled to its liquidation preference (rather than its Common Stock payout) where its preferred stock was converted to common stock prior to a liquidation event.
                - link "↩" [ref=e981] [cursor=pointer]:
                  - /url: "#fn-ref-65"
            - listitem [ref=e982]:
              - paragraph [ref=e983]:
                - text: It is not uncommon for the conversion rate to be punitive such that each share of Preferred Stock is converted into a lesser number of shares of Common Stock. In these situations, Section 5A.1 needs to be modified accordingly. In order to avoid the punitive conversion, Preferred Stockholders may have an incentive to voluntarily convert their Preferred Stock on a 1:1 basis prior to the automatic Special Mandatory Conversion. In order to avoid this outcome, consider prohibiting Section 4 optional conversion during the pendency of any Special Mandatory Conversion; if only tied to milestones/tranching applicable to Purchasers under the Stock Purchase Agreement consider including a covenant there as well.
                - link "↩" [ref=e984] [cursor=pointer]:
                  - /url: "#fn-ref-66"
            - listitem [ref=e985]:
              - paragraph [ref=e986]:
                - text: This provision has been carefully crafted to help ensure enforceability. Extra caution should be taken where modifications are made.
                - link "↩" [ref=e987] [cursor=pointer]:
                  - /url: "#fn-ref-67"
            - listitem [ref=e988]:
              - paragraph [ref=e989]:
                - text: "*New October 2025* If the Stock Purchase Agreement contains tranching with a pay-to-play penalty for failure to fund a later tranche, carefully tailor the defined terms and mechanics herein to align with the agreed provisions in the Stock Purchase Agreement."
                - link "↩" [ref=e991] [cursor=pointer]:
                  - /url: "#fn-ref-68"
            - listitem [ref=e992]:
              - paragraph [ref=e993]:
                - text: Parties can consider harmonizing with the notice period for rights of first offer in Section 4 of the Investors’ Rights Agreement.
                - link "↩" [ref=e995] [cursor=pointer]:
                  - /url: "#fn-ref-69"
            - listitem [ref=e996]:
              - paragraph [ref=e997]:
                - text: Careful consideration must be given to whether shares of Preferred Stock converted upon a Special Mandatory Conversion should lose the contractual rights provided under the various ancillary agreements typically involved in a Preferred Stock financing (e.g., registration rights, pre-emptive rights, etc.).
                - link "↩" [ref=e998] [cursor=pointer]:
                  - /url: "#fn-ref-70"
            - listitem [ref=e999]:
              - paragraph [ref=e1000]:
                - text: "For uncertificated shares of Common Stock, use the following for (a): “issue and deliver to such holder, or to his, her or its nominees, a notice of issuance of uncertificated shares and may, upon written request, issue and deliver a certificate for the number of full shares of Common Stock issuable upon such conversion in accordance with the provisions hereof”."
                - link "↩" [ref=e1001] [cursor=pointer]:
                  - /url: "#fn-ref-71"
            - listitem [ref=e1002]:
              - paragraph [ref=e1003]:
                - text: Applicable only if proportional conversion is provided for by the Certificate of Incorporation.
                - link "↩" [ref=e1004] [cursor=pointer]:
                  - /url: "#fn-ref-72"
            - listitem [ref=e1005]:
              - paragraph [ref=e1006]:
                - text: "For uncertificated shares of Common Stock, use the following for (c): “may, if applicable and upon written request, issue and deliver a new certificate for the number of shares, if any, of Preferred Stock represented by such surrendered shares and not converted pursuant to Section 5A.1”."
                - link "↩" [ref=e1007] [cursor=pointer]:
                  - /url: "#fn-ref-73"
            - listitem [ref=e1008]:
              - paragraph [ref=e1009]:
                - text: Applicable only if proportional conversion is provided for by the Certificate of Incorporation.
                - link "↩" [ref=e1010] [cursor=pointer]:
                  - /url: "#fn-ref-74"
            - listitem [ref=e1011]:
              - paragraph [ref=e1012]:
                - text: "Alternative: “the number of shares of outstanding Common Stock owned by such holder, and the denominator of which is equal to the aggregate number of outstanding shares of Common Stock (for the purpose of this definition, treating all shares of Common Stock issuable upon exercise of Options outstanding immediately prior to such Qualified Financing or upon conversion of Convertible Securities outstanding (assuming exercise of any outstanding Options therefor) immediately prior to such Qualified Financing as outstanding).”"
                - link "↩" [ref=e1013] [cursor=pointer]:
                  - /url: "#fn-ref-75"
            - listitem [ref=e1014]:
              - paragraph [ref=e1015]:
                - text: Redemption provisions are uncommon in early-stage financings. If there are no redemption rights, use the first bracketed alternative, not the detailed redemption provisions in 6-1-6.5.
                - link "↩" [ref=e1016] [cursor=pointer]:
                  - /url: "#fn-ref-76"
            - listitem [ref=e1017]:
              - paragraph [ref=e1018]:
                - text: In the wake of the Delaware Chancery Court’s opinion in In re Trados Inc. S’holder Litig., 2009 WL 2225958 (Del. Ch. Jul. 24, 2009), investors may be forgoing a substantial protection/benefit if they do not have the right to put their shares back to the Corporation at a time when they may wish to seek the sale of the Corporation because the board would not be able to use compliance with the Corporation’s contractual redemption obligation to justify the fiduciary decision to sell the Corporation.
                - link "↩" [ref=e1019] [cursor=pointer]:
                  - /url: "#fn-ref-77"
            - listitem [ref=e1020]:
              - paragraph [ref=e1021]:
                - text: "Replace with the following if accruing dividends are selected: “the Original Issue Price per share, plus any Accruing Dividends accrued but unpaid thereon, whether or not declared, together with any other dividends declared but unpaid thereon.”"
                - link "↩" [ref=e1022] [cursor=pointer]:
                  - /url: "#fn-ref-78"
            - listitem [ref=e1023]:
              - paragraph [ref=e1024]: Redemption prices are sometimes fixed at the greater of the Original Issue Price (plus dividends, if applicable) and the fair market value of the Preferred Stock on the date of the Redemption Notice or the date of redemption. When structuring redeemable Preferred Stock, consideration should be given to Section 305(c) of the Internal Revenue Code. Section 305(c) provides that, in certain circumstances, redemption premiums on Preferred Stock are treated for tax purposes in the same manner as original issue discount on bonds. That is, redemption premiums are generally treated as being distributed to the holders of Preferred Stock over the period that the Preferred Stock is outstanding (the “Constructive Distribution Rule”). Distribution amounts for tax periods prior to redemption are determined by applying the yield to maturity (determined as the discount rate that, when used to compute the present value of the redemption price, produces an amount equal to the issue price of the Preferred Stock) to the issue price plus previously accrued amounts. If Preferred Stock is subject to either an automatic redemption or redemption at the request of the Preferred Stockholders, the only exception to the Constructive Distribution Rule is for a redemption premium that is de minimis in amount (the “De Minimis Exception”). The De Minimis Exception applies where the amount by which the redemption price at maturity exceeds the issue price is less than 0.25% of the redemption price multiplied by the number of complete years to maturity.
              - paragraph [ref=e1025]:
                - text: The Constructive Distribution Rule only applies to stock that is treated as “preferred stock” for tax purposes. Applicable Treasury Regulations under Code Section 305 indicate that a class of stock will be treated as “preferred stock” only if it has limited rights to participate in the growth of the issuer (as determined without regard to any conversion right inherent in the stock). Thus, Preferred Stock with unlimited rights to participate (a) in dividend distributions and (b) upon liquidation in excess of any stated preference (all as determined without regard to any right to convert such stock into Common Stock) will allow holders of such Preferred Stock to assert that their stock is not “preferred stock” for tax purposes. Note that even “nonparticipating” Preferred Stock can be structured in this manner by providing (as does this form) that upon liquidation of the Corporation the Preferred Stock will receive the greater of (i) its liquidation preference or (ii) the amount the holders of such Preferred Stock would receive if the proceeds were distributed to holders based on the number of shares of Common Stock into which the Preferred Stock could then be converted.
                - link "↩" [ref=e1026] [cursor=pointer]:
                  - /url: "#fn-ref-79"
            - listitem [ref=e1027]:
              - paragraph [ref=e1028]:
                - text: The redemption rights in this model charter assume the Preferred Stock is all pari passu. If there are different orders of priority, revise accordingly to account for the same.
                - link "↩" [ref=e1030] [cursor=pointer]:
                  - /url: "#fn-ref-80"
            - listitem [ref=e1031]:
              - paragraph [ref=e1032]:
                - text: The Corporation’s accountants may take the position that, because the holders of Preferred Stock have the right to force a redemption, the Preferred Stock should be reflected above the stockholders’ equity section of the Corporation’s balance sheet, as opposed to in the stockholders’ equity section of the balance sheet. If so, it is not uncommon for a Corporation to have negative stockholders’ equity. In addition, if the Preferred Stock is redeemable at the greater of the original purchase price and the then current fair market value, this might cause the Corporation to have to “mark to market” the redeemable Preferred Stock each quarter, which could cause significant practical and accounting complexities for the Corporation. The Corporation may want to consult with its accountants about this.
                - link "↩" [ref=e1033] [cursor=pointer]:
                  - /url: "#fn-ref-81"
            - listitem [ref=e1034]:
              - paragraph [ref=e1035]:
                - text: This sentence has been added in response to the Delaware Chancery Court’s opinion in SV Inv. Partners, LLC v. ThoughtWorks, Inc., 7 A.3d 973 (Del. Ch. 2010) (see footnote 84), and is intended to require the corporation to use all of its assets (other than those required to pay its debts as they come due and to continue as a going concern under applicable Delaware law) to redeem the Preferred Stock. Because in light of TCV VI, L.P. v. TradingScreen Inc., 2015 WL 1598045 (Del Ch. Feb. 26, 2015) (discussed in footnote 85 below) it is not clear to what extent a redemption obligation can be given priority over other obligations the board views as more important, consideration should be given to expanding the protective provisions in Section 3.3 in the event that a redemption obligation is not honored to include consent rights over uses of funds for other purposes, particularly where those alternative uses involve deviations from the Corporation’s previous ordinary course operations.
                - link "↩" [ref=e1036] [cursor=pointer]:
                  - /url: "#fn-ref-82"
            - listitem [ref=e1037]:
              - paragraph [ref=e1038]:
                - text: Fair market value could also be determined by the Board with the concurrence of the designee of the holders of Preferred Stock on the Board.
                - link "↩" [ref=e1039] [cursor=pointer]:
                  - /url: "#fn-ref-83"
            - listitem [ref=e1040]:
              - paragraph [ref=e1041]:
                - text: The bracketed language, although not commonplace, may be desirable to minority investors in the Preferred. If this is included, also include the applicable bracketed language in Section 6.2.
                - link "↩" [ref=e1042] [cursor=pointer]:
                  - /url: "#fn-ref-84"
            - listitem [ref=e1043]:
              - paragraph [ref=e1044]:
                - text: Investors may also seek enforcement provisions for failure to redeem, including provisions that may entitle the investors to gain control of the Board of Directors. Such provisions are generally atypical in early-stage venture transactions but are seen from time to time in private equity and late-stage venture transactions. However, that may change in the wake of the Delaware Chancery Court’s opinion in SV Inv. Partners, LLC v. ThoughtWorks, Inc., 7 A.3d 973 (Del. Ch. 2010), in which the Court construed the words “funds legally available” in a manner unhelpful to investors. The Court described a number of “additional protections” that the investors could have included to give their redemption rights more teeth and stated that “sophisticated investors understand that mandatory redemption rights provide limited protection and function imperfectly, particularly when a corporation is struggling financially.” See also footnote 81.
                - link "↩" [ref=e1045] [cursor=pointer]:
                  - /url: "#fn-ref-85"
            - listitem [ref=e1046]:
              - paragraph [ref=e1047]:
                - text: This interest provision has been added as an alternative for investors wanting to address the Delaware Chancery Court’s rulings in TCV VI, L.P. v. TradingScreen Inc., 2015 WL 1598045 (Del Ch. Feb. 26, 2015, redacted March 27, 2015) and SV Inv. Partners, LLC v. ThoughtWorks, Inc., 7 A.3d 973 (Del. Ch. 2010), which suggested that a board’s decision regarding how much of a corporation’s funds can be used to redeem mandatorily redeemable preferred stock is protected by the business judgment rule. Those rulings may allow a corporation’s board of directors to defer a redemption obligation, even where the corporation has sufficient legal surplus to effect the redemption. Provisions such as this one provide an economic inducement for the corporation to effect the redemption, or at least provide some compensation to the investor for the corporation’s failure to redeem. Note that it is important that the trigger for this provision, if utilized, should be the failure to pay the redemption price on the due date “for any reason” – the court in Trading Screen held that an increased interest rate upon a “default” with respect to payment of the redemption obligation was not triggered in that case because there is no “default” if the corporation cannot lawfully redeem the stock. Including this type of interest provision to induce compliance with a redemption obligation may be even more important following the Delaware Chancery Court’s ruling in Frederick Hsu Living Tr. v. ODN Holding Corp., 2017 WL 1437308 (Del. Ch. Apr. 14, 2017), in which the court suggested that where the amount of a redemption obligation is fixed and will not increase over time a board of directors may breach its fiduciary duties by complying with such obligation rather than growing the corporation’s business for the benefit of the corporation’s common stockholders and gradually redeeming shares over a long-term horizon. The court also noted that absent an increasing redemption obligation, the holders of redeemable stock are in a relatively weak contractual position to cause the corporation to redeem their shares and that the board of directors may have an obligation to leverage such weak position for the benefit of the corporation and its residual claimants, including by, among other things, not agreeing to confer benefits (such as a new cumulative dividend) in exchange for a holder’s forbearance of the exercise of a redemption obligation.
                - link "↩" [ref=e1048] [cursor=pointer]:
                  - /url: "#fn-ref-86"
            - listitem [ref=e1049]:
              - paragraph [ref=e1050]:
                - text: "The DGCL was amended effective August 1, 2022 to expand the scope of persons who can be exculpated from breaches of the duty of care to include certain officers. This was done in response to a trend in public company stockholder litigation of suing inside board members in their capacities as officers (as well as directors) in order to avoid dismissal of fiduciary duty claims for which directors are exculpated under In re Cornerstone Therapeutics, Inc., 115 A.3d 1173 (Del. 2015). See generally, Lawrence A. Hamermesh, Jack B. Jacobs & Leo E. Strine, Jr., Optimizing The World’s Leading Corporate Law: A Twenty-Year Retrospective and Look Ahead, 77 Bus. Law. 321, 364-71 (2022). The inclusion of such a provision will not prevent investors from suing officers for breaches of the duty of loyalty or bringing derivative actions against them for breach of the duty of care (just direct actions). From the investor’s standpoint, whether to include executive officers in the exculpation provision involves balancing the ability of investors to sue officers directly for breaches of the duty of care (as opposed to derivatively) and the benefits of providing officers with the maximum protection against stockholder suits permitted by law. There is also the possibility that including such a provision may lower D&O insurance rates, which would need to be determined on a company-by-company basis."
                - link "↩" [ref=e1051] [cursor=pointer]:
                  - /url: "#fn-ref-87"
            - listitem [ref=e1052]:
              - paragraph [ref=e1053]:
                - text: This provision authorizes the indemnification of directors, officers and agents of the Corporation, but does not require it. Investors who have the right or ability to appoint affiliates to the Board of Directors often request that more detailed, mandatory indemnification provisions be included in the Certificate of Incorporation, bylaws, and/or indemnification contracts and insurance coverage. A form of mandatory indemnification provision, which could be inserted in this Article Tenth in place of what is currently there, is attached as Exhibit A.
                - link "↩" [ref=e1054] [cursor=pointer]:
                  - /url: "#fn-ref-88"
            - listitem [ref=e1055]:
              - paragraph [ref=e1056]:
                - text: Section 122(17) of the DGCL permits the Corporation to renounce in its Certificate of Incorporation the Corporation’s interest or expectancy in specified business opportunities or specified classes or categories of business opportunities. This enables the Corporation to determine in advance whether these opportunities are corporate opportunities of the Corporation rather than to address such opportunities as they arise. Venture capital investors may be concerned about having to provide these opportunities to the Corporation and thus may seek this type of provision. Note that the defined term “Excluded Opportunity” in the above example is very pro-investor. The foregoing Article Eleventh is merely an example of such a provision, and is not necessarily an appropriate starting point for any particular transaction.
                - link "↩" [ref=e1057] [cursor=pointer]:
                  - /url: "#fn-ref-89"
            - listitem [ref=e1058]:
              - paragraph [ref=e1059]:
                - text: In order to avoid forum shopping in a situation where several courts might have personal and subject matter jurisdiction over the parties and claims, Delaware corporations may elect to have Delaware courts be the exclusive forum for any stockholder litigation. Courts outside of Delaware have generally enforced Delaware exclusive forum provisions.
                - link "↩" [ref=e1060] [cursor=pointer]:
                  - /url: "#fn-ref-90"
            - listitem [ref=e1061]:
              - paragraph [ref=e1062]:
                - text: Because Section 2115 of the California Corporations Code purports to impose California corporate laws on foreign corporations with sufficient assets and stockholders in the State of California, corporations incorporated in other states with California stockholders and assets in California should consider adopting a provision similar to the one above. Section 500(a) of the California Corporations Code sets forth a solvency test governing when a corporation may make distributions to stockholders or redeem shares of stock, including distributions to junior stockholders and redemptions of junior stock. Section 502(b) of the California Corporations Code allows the corporation and the holders of Preferred Stock to opt out of the restrictions on distributions to junior stockholders and redemptions of junior stock in the Certificate of Incorporation. Consider whether other board-approved repurchases should be opted out as well.
                - link "↩" [ref=e1063] [cursor=pointer]:
                  - /url: "#fn-ref-91"
            - listitem [ref=e1064]:
              - paragraph [ref=e1065]:
                - text: See Section 103 of the DGCL for the requirements regarding the execution of the Restated Certificate of Incorporation.
                - link "↩" [ref=e1066] [cursor=pointer]:
                  - /url: "#fn-ref-92"
            - listitem [ref=e1067]:
              - paragraph [ref=e1068]:
                - text: If indemnification agreements will be used for directors, care should be given to ensure that the provisions of such indemnification agreements and any mandatory indemnification provision contained in the Certificate of Incorporation or bylaws (or elsewhere) do not conflict.
                - link "↩" [ref=e1069] [cursor=pointer]:
                  - /url: "#fn-ref-93"
            - listitem [ref=e1070]:
              - paragraph [ref=e1071]:
                - text: Most bylaws make indemnification of officers mandatory, but non-officer employees discretionary. The line between officers and employees in some companies is vague, with employees having titles such as Vice President etc. In Delaware, in the absence of a definition, “officers” may be interpreted to encompass all employees with the officer titles authorized in the bylaws, such as “vice presidents”. Consideration should be given to whether it would be appropriate to add a definition of “officers” so as to limit officers for whom indemnification is mandatory. Such a provision might read, “For purposes of this Article Tenth, “officers” shall include [only officers appointed by the Board of Directors][officers with a title above [Title]]”.
                - link "↩" [ref=e1072] [cursor=pointer]:
                  - /url: "#fn-ref-94"
            - listitem [ref=e1073]:
              - paragraph [ref=e1074]:
                - text: Consider adding other exceptions as provided in Section 9 of the model Indemnification Agreement. Recent provisions may also include exceptions for conduct found to be in violation of the Corporation’s Code of Conduct.
                - link "↩" [ref=e1075] [cursor=pointer]:
                  - /url: "#fn-ref-95"
