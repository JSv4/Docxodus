          - paragraph [ref=e215]:
            - text: The Corporation shall not declare, pay or set aside any dividends on shares of any other class or series of capital stock of the Corporation (other than dividends on shares of Common Stock payable in shares of Common Stock
            - link [ref=e216] [cursor=pointer]:
