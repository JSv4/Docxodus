          - heading "9. Notices. Any notice required or permitted by the provisions of this Article Fourth to be given to a holder of shares of Preferred Stock shall be mailed, postage prepaid, to the post office address last shown on the records of the Corporation, or given by electronic transmission in compliance with the provisions of the General Corporation Law, and shall be deemed sent upon such mailing or electronic transmission." [level=4] [ref=e688]:
