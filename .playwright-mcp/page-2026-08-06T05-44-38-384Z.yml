          - heading [level=5] [ref=e562]:
            - generic [ref=e563]: "4.8"
            - text: Adjustment for Merger or Reorganization, etc. Subject to the provisions of Section 2.3, if there shall occur any reorganization, recapitalization, reclassification, consolidation or merger involving the Corporation in which the Common Stock (but not the Preferred Stock) is converted into or exchanged for securities, cash or other property (other than a transaction covered by Sections 4.4, 4.6 or 4.7), then, following any such reorganization, recapitalization, reclassification, consolidation or merger, each share of Preferred Stock shall thereafter be convertible in lieu of the Common Stock into which it was convertible prior to such event into the kind and amount of securities, cash or other property which a holder of the number of shares of Common Stock of the Corporation issuable upon conversion of one share of such Preferred Stock immediately prior to such reorganization, recapitalization, reclassification, consolidation or merger would have been entitled to receive pursuant to such transaction; and, in such case, appropriate adjustment (as determined in good faith by the Board of Directors) shall be made in the application of the provisions in this Section 4 with respect to the rights and interests thereafter of the holders of the Preferred Stock, to the end that the provisions set forth in this Section 4.8 (including provisions with respect to changes in and other adjustments of the Conversion Price of each series of Preferred Stock) shall thereafter be applicable, as nearly as reasonably may be, in relation to any securities or other property thereafter deliverable upon the conversion of the Preferred Stock.
