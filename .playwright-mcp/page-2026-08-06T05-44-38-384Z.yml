            - text: Procedural Requirements. Upon a Special Mandatory Conversion, each holder of shares of Preferred Stock converted pursuant to Section 5A.1 shall be sent written notice of such Special Mandatory Conversion and the place designated for mandatory conversion of all such shares of Preferred Stock pursuant to this Section 5A. Upon receipt of such notice, each holder of such shares of Preferred Stock in certificated form shall surrender his, her or its certificate or certificates for all such shares (or, if such holder alleges that any such certificate has been lost, stolen or destroyed, a lost certificate affidavit and agreement reasonably acceptable to the Corporation to indemnify the Corporation against any claim that may be made against the Corporation on account of the alleged loss, theft or destruction of such certificate) to the Corporation at the place designated in such notice. If so required by the Corporation, any certificates surrendered for conversion shall be endorsed or accompanied by written instrument or instruments of transfer, in form satisfactory to the Corporation, duly executed by the registered holder or by his, her or its attorney duly authorized in writing. All rights with respect to the Preferred Stock converted pursuant to Section 5A.1, including the rights, if any, to receive notices and vote (other than as a holder of Common Stock), will terminate at the time of the Special Mandatory Conversion (notwithstanding the failure of the holder or holders thereof to surrender any certificates for such shares at or prior to such time), except only the rights of the holders thereof, upon surrender of any certificate or certificates of such holders therefor (or lost certificate affidavit and agreement), to receive the items provided for in the next sentence of this Section 5A.2. As soon as practicable after the Special Mandatory Conversion and, if applicable, the surrender of any certificate or certificates (or lost certificate affidavi