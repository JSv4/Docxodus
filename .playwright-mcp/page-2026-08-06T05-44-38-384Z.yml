          - heading "4.4.6 Multiple Closing Dates. In the event the Corporation shall issue on more than one date Additional Shares of Common Stock that are a part of one transaction or a series of related transactions and that would result in an adjustment to the Conversion Price of a series of Preferred Stock pursuant to the terms of Section 4.4.4[, and such issuance dates occur within a period of no more than [180] days from the first such issuance to the final such issuance,] then, upon the final such issuance, the Conversion Price for such series of Preferred Stock shall be readjusted to give effect to all such issuances as if they occurred on the date of the first such issuance (and without giving effect to any additional adjustments as a result of any such subsequent issuances within such period)." [level=6] [ref=e543]:
            - generic [ref=e544]: 4.4.6
            - text: Multiple Closing Dates. In the event the Corporation shall issue on more than one date Additional Shares of Common Stock that are a part of one transaction or a series of related transactions and that would result in an adjustment to the Conversion Price of a series of Preferred Stock pursuant to the terms of Section 4.4.4[, and such issuance dates occur within a period of no more than [180] days from the first such issuance to the final such issuance,] then, upon the final such issuance, the Conversion Price for such series of Preferred Stock shall be readjusted to give effect to all such issuances as if they occurred on the date of the first such issuance (and without giving effect to any additional adjustments as a result of any such subsequent issuances within such period).
          - heading [level=5] [ref=e545]:
