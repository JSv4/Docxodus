          - paragraph [ref=e621]:
            - generic [ref=e622]: 5A.3.
            - text: "Definitions. For purposes of this Section 5A, the following definitions shall apply:"
          - paragraph [ref=e623]:
            - generic [ref=e624]: 5A.3.1
            - text: “Affiliate” shall mean, with respect to any holder of shares of Preferred Stock, any person, entity or firm which, directly or indirectly, controls, is controlled by or is under common control with such holder, including, without limitation, any entity of which the holder is a partner or member, any partner, officer, director, member or employee of such holder and any venture capital fund or other investment fund now or hereafter existing of which the holder is a partner or member which is controlled by or under common control with one or more general partners, managing members or investment advisors of such holder or shares the same management company or investment advisor with such holder.
          - paragraph [ref=e625]:
            - generic [ref=e626]: 5A.3.2
            - text: "[“Applicable Portion” shall mean, with respect to any holder of shares of Preferred Stock, a number of shares of Preferred Stock calculated by multiplying the aggregate number of shares of Preferred Stock held by such holder immediately prior to a Qualified Financing by a fraction, the numerator of which is equal to the amount, if positive, by which such holder’s Pro Rata Amount exceeds the number of Offered Securities actually purchased by such holder in such Qualified Financing, and the denominator of which is equal to such holder’s Pro Rata Amount.]"
            - link [ref=e627] [cursor=pointer]:
              - /url: "#fn-74"
              - superscript [ref=e628]: "73"
          - paragraph [ref=e629]:
            - generic [ref=e630]: 5A.3.3
            - text: “Offered Securities” shall mean the equity securities of the Corporation set aside by the Board of Directors for purchase by holders of outstanding shares of Preferred Stock in connection with a Qualified Financing, and offered to such holders.
          - paragraph [ref=e631]:
            - generic [ref=e632]: 5A.3.4
            - text: “Pro Rata Amount” shall mean, with respect to any holder of Preferred Stock, the lesser of (a) a number of Offered Securities calculated by multiplying the aggregate number of Offered Securities by a fraction, the numerator of which is equal to [the number of shares of Preferred Stock owned by such holder, and the denominator of which is equal to the aggregate number of outstanding shares of Preferred Stock],
            - link [ref=e633] [cursor=pointer]:
              - /url: "#fn-75"
              - superscript [ref=e634]: "74"
            - text: or (b) the maximum number of Offered Securities that such holder is permitted by the Corporation to purchase in such Qualified Financing, after giving effect to any cutbacks or limitations established by the Board of Directors and applied on a pro rata basis to all holders of Preferred Stock.
          - paragraph [ref=e635]:
            - generic [ref=e636]: 5A.3.5
            - text: “Qualified Financing” shall mean any transaction involving the issuance or sale of Additional Shares of Common Stock after the Original Issue Date [that would result in at least $_______ in gross proceeds to the Corporation, [including/excluding] proceeds previously received by Corporation for debt that is being cancelled or converted in connection with such issuance] [or result in the reduction of the Conversion Price of any series of Preferred Stock pursuant to the terms of this Certificate of Incorporation (without giving effect to the operation of Section 4.4.2]], unless the [Requisite Holders] elect, by written notice sent to the Corporation at least [__] days prior to the consummation of the Qualified Financing, that such transaction not be treated as a Qualified Financing for purposes of this Section 5A.
          - heading "6. Redemption. [Other than as set forth in Section 2.3.2(b), the Preferred Stock is not redeemable at the option of the holder or the Corporation.]75,76" [level=4] [ref=e637]:
