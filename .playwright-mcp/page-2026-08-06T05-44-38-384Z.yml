              - superscript [ref=e711]: "89"
          - 'heading "Thirteenth: If any provision or provisions of this Certificate of Incorporation shall be held to be invalid, illegal or unenforceable as applied to any person or entity or circumstance for any reason whatsoever, then, to the fullest extent permitted by law, the validity, legality and enforceability of such provisions in any other circumstance and of the remaining provisions of this Certificate of Incorporation (including, without limitation, each portion of any sentence of this Certificate of Incorporation containing any such provision held to be invalid, illegal or unenforceable that is not itself held to be invalid, illegal or unenforceable) and the application of such provision to other persons or entities and circumstances shall not in any way be affected or impaired thereby." [level=2] [ref=e712]'
          - heading [level=2] [ref=e713]:
            - text: "Fourteenth: [For purposes of Section 500 of the California Corporations Code (to the extent applicable), in connection with any repurchase of shares of Common Stock permitted under this Certificate of Incorporation from employees, officers, directors or consultants of the Corporation in connection with a termination of employment or services pursuant to agreements or arrangements approved by the Board of Directors (in addition to any other consent required under this Certificate of Incorporation), such repurchase may be made without regard to any “preferential dividends arrears amount” or “preferential rights amount” (as those terms are defined in Section 500 of the California Corporations Code). Accordingly, for purposes of making any calculation under California Corporations Code Section 500 in connection with such repurchase, the amount of any “preferential dividends arrears amount” or “preferential rights amount” (as those terms are defined therein) shall be deemed to be zero.]"
