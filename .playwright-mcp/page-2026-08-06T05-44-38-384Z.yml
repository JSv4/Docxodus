          - paragraph [ref=e673]:
            - text: "[If the Corporation receives, on or prior to the 20"
            - superscript [ref=e675]: th
            - text: day after the date of delivery of the Redemption Notice to a holder of Preferred Stock, written notice from such holder that such holder elects to be excluded from the redemption provided in this Section 6, then the shares of Preferred Stock registered on the books of the Corporation in the name of such holder at the time of the Corporation’s receipt of such notice shall thereafter be “Excluded Shares.” Excluded Shares shall not be redeemed or redeemable pursuant to this Section 6, whether on such Redemption Date or thereafter.]
          - heading [level=5] [ref=e676]:
            - generic [ref=e677]: "6.3"
            - text: Surrender of Certificates; Payment. On or before the applicable Redemption Date, each holder of shares of Preferred Stock to be redeemed on such Redemption Date, unless such holder has exercised his, her or its right to convert such shares as provided in Section 4, shall, if a holder of shares in certificated form, surrender the certificate or certificates representing such shares (or, if such registered holder alleges that such certificate has been lost, stolen or destroyed, a lost certificate affidavit and agreement reasonably acceptable to the Corporation to indemnify the Corporation against any claim that may be made against the Corporation on account of the alleged loss, theft or destruction of such certificate) to the Corporation, in the manner and at the place designated in the Redemption Notice, and thereupon the Redemption Price for such shares shall be payable to the order of the person whose name appears on such certificate or certificates as the owner thereof. In the event less than all of the shares of Preferred Stock represented by a certificate are redeemed, a new certificate, instrument, or book entry representing the unredeemed shares of Preferred Stock shall promptly be issued to such holder.
          - heading [level=5] [ref=e678]:
            - generic [ref=e679]: "6.4"
            - text: Interest. If any shares of Preferred Stock are not redeemed for any reason on any Redemption Date, all such unredeemed shares shall remain outstanding and entitled to all the rights and preferences provided herein, and the Corporation shall pay interest on the Redemption Price applicable to such unredeemed shares at an aggregate per annum rate equal to [12]% (increased by 1% each month following the Redemption Date until the Redemption Price, and any interest thereon, is paid in full), with such interest to accrue daily in arrears and be compounded [annually]; provided, however, that in no event shall such interest exceed the maximum permitted rate of interest under applicable law (the “Maximum Permitted Rate”), provided, however, that the Corporation shall take all such actions as may be necessary, including, without limitation, making any applicable governmental filings, to cause the Maximum Permitted Rate to be the highest possible rate. In the event any provision hereof would result in the rate of interest payable hereunder being in excess of the Maximum Permitted Rate, the amount of interest required to be paid hereunder shall automatically be reduced to eliminate such excess; provided, however, that any subsequent increase in the Maximum Permitted Rate shall be retroactively effective to the applicable Redemption Date to the extent permitted by law.
