            - text: (the “Redemption Request”).
            - link [ref=e653] [cursor=pointer]:
              - /url: "#fn-81"
              - superscript [ref=e654]: "80"
            - text: Upon receipt of a Redemption Request, the Corporation shall apply all of its assets to any such redemption, and to no other corporate purpose, except to the extent prohibited by Delaware law governing distributions to stockholders.
            - link [ref=e655] [cursor=pointer]:
              - /url: "#fn-82"
              - superscript [ref=e656]: "81"
            - text: "[For purposes of this Section 6.1, the Fair Market Value of a single share of Preferred Stock shall be the value of a single share of Preferred Stock as mutually agreed upon by the Corporation and the holders of a majority of the shares of Preferred Stock then outstanding, and, in the event that they are unable to reach agreement, by a third-party appraiser agreed to by the Corporation and the holders of a majority of the shares of Preferred Stock then outstanding.]"
            - link [ref=e657] [cursor=pointer]:
              - /url: "#fn-83"
              - superscript [ref=e658]: "82"
            - text: The date of each such installment provided in the Redemption Notice (as defined below) shall be referred to as a “Redemption Date.” On each Redemption Date, the Corporation shall redeem, on a pro rata basis in accordance with the number of shares of Preferred Stock owned by each holder, that number of outstanding shares of Preferred Stock determined by dividing (i) the total number of shares of Preferred Stock outstanding immediately prior to such Redemption Date by (ii) the number of remaining Redemption Dates (including the Redemption Date to which such calculation applies)[; provided, however, that Excluded Shares (as such term is defined in Section 6.2) shall not be redeemed and shall be excluded from the calculations set forth in this sentence].
            - link [ref=e659] [cursor=pointer]:
              - /url: "#fn-84"
              - superscript [ref=e660]: "83"
            - text: If on any Redemption Date Delaware law governing distributions to stockholders prevents the Corporation from redeeming all shares of [the series of] Preferred Stock to be redeemed, the Corporation shall ratably redeem the maximum number of shares that it may redeem consistent with such law, and shall redeem the remaining shares as soon as it may lawfully do so under such law.
