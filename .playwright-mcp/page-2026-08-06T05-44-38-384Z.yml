          - paragraph [ref=e557]: Notwithstanding the foregoing, (a) if such record date shall have been fixed and such dividend is not fully paid or if such distribution is not fully made on the date fixed therefor, the Conversion Price of each series of Preferred Stock shall be recomputed accordingly as of the close of business on such record date and thereafter the Conversion Price of each series of Preferred Stock shall be adjusted pursuant to this Section 4.6 as of the time of actual payment of such dividends or distributions; and (b) no such adjustment shall be made if the holders of such series of Preferred Stock simultaneously receive a dividend or other distribution of shares of Common Stock in a number equal to the number of shares of Common Stock as they would have received if all outstanding shares of such series of Preferred Stock had been converted into Common Stock on the date of such event.
          - heading [level=5] [ref=e558]:
            - generic [ref=e559]: "4.7"
            - text: Adjustments for Other Dividends and Distributions. If at any time or from time to time after the Original Issue Date the Corporation shall make or issue, or fix a record date for the determination of holders of Common Stock entitled to receive, a dividend or other distribution payable in securities of the Corporation (other than a distribution of shares of Common Stock in respect of outstanding shares of Common Stock) or in other property and the provisions of Section 1 do not apply to such dividend or distribution, then and in each such event the holders of Preferred Stock shall receive, simultaneously with the distribution to the holders of Common Stock, a dividend or other distribution of such securities or other property in an amount equal to the amount of such securities or other property as they would have received if all outstanding shares of Preferred Stock had been converted into Common Stock on the date of such event.
