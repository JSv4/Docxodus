          - heading "4.3 Mechanics of Conversion." [level=5] [ref=e423]:
            - generic [ref=e424]: "4.3"
            - text: Mechanics of Conversion.
          - heading [level=6] [ref=e425]:
            - generic [ref=e426]: 4.3.1
            - text: Notice of Conversion. In order for a holder of Preferred Stock to voluntarily convert shares of Preferred Stock into shares of Common Stock, such holder shall (a) provide written notice to the Corporation at the principal office of the Corporation that such holder elects to convert all or any number of such holder’s shares of Preferred Stock and, if applicable, any event on which such conversion is contingent and (b) if such holder’s shares are certificated, tender to the Corporation at its principal office (1) the certificate or certificates for such shares of Preferred Stock or (2) a stock assignment separate from certificate if such certificate or certificates are electronic (or, if such registered holder alleges that such certificate has been lost, stolen or destroyed, a lost certificate affidavit and agreement reasonably acceptable to the Corporation to indemnify the Corporation against any claim that may be made against the Corporation on account of the alleged loss, theft or destruction of such certificate). If required by the Corporation, any certificates surrendered for conversion shall be endorsed or accompanied by a written instrument or instruments of transfer, in form satisfactory to the Corporation, duly executed by the registered holder or his, her or its attorney duly authorized in writing. [Unless a later time and date is otherwise specified by the holder,] the close of business on the date of receipt by the transfer agent (or by the Corporation if the Corporation serves as its own transfer agent) of such notice and, if applicable, certificates (or lost certificate affidavit and agreement) shall be the time of conversion (the “Conversion Time”), and the shares of Common Stock issuable upon conversion of the specified shares shall be deemed to be outstanding of record as of such date. The Corporation shall, as soon as practicable after the Conversion Time (i) issue and deliver to such holder of Preferred Stock, or to his, her or its nominees, a certificate or certificates (whether electronic or physical) for the number of full shares of Common Stock issuable upon such conversion in accordance with the provisions hereof and a certificate for the number (if any) of the shares of Preferred Stock represented by the surrendered certificate that were not converted into Common Stock
            - link [ref=e427] [cursor=pointer]:
              - /url: "#fn-50"
              - superscript [ref=e428]: "49"
            - text: ", and (ii) pay all declared but unpaid dividends on the shares of Preferred Stock converted."
          - heading [level=6] [ref=e429]:
            - generic [ref=e430]: 4.3.2
            - text: Reservation of Shares. The Corporation shall at all times when the Preferred Stock shall be outstanding, reserve and keep available out of its authorized but unissued capital stock, for the purpose of effecting the conversion of the Preferred Stock, such number of its duly authorized shares of Common Stock as shall from time to time be sufficient to effect the conversion of all outstanding Preferred Stock; and if at any time the number of authorized but unissued shares of Common Stock shall not be sufficient to effect the conversion of all then outstanding shares of the Preferred Stock, the Corporation shall take such corporate action as may be necessary to increase its authorized but unissued shares of Common Stock to such number of shares as shall be sufficient for such purposes, including, without limitation, engaging in best efforts to obtain the requisite stockholder approval of any necessary amendment to this Certificate of Incorporation. Before taking any action that would cause an adjustment reducing the Conversion Price for any series of Preferred Stock below the then par value of the shares of Common Stock issuable upon conversion of such series of Preferred Stock, the Corporation will take any corporate action which may, in the opinion of its counsel, be necessary in order that the Corporation may validly and legally issue fully paid and non-assessable shares of Common Stock at such adjusted Conversion Price.
