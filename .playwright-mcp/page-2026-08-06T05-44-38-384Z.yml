          - heading [level=6] [ref=e307]:
            - generic [ref=e308]: 2.3.4
            - text: Allocation of Escrow and Contingent Consideration. In the event of a Deemed Liquidation Event pursuant to Section 2.3.1(a)(i), if any portion of the consideration payable to the stockholders of the Corporation is payable only upon satisfaction of contingencies (the “Additional Consideration”), the Transaction Document shall provide that (a) the portion of such consideration that is not Additional Consideration (such portion, the “Initial Consideration”) shall be allocated among the holders of capital stock of the Corporation in accordance with Sections 2.1 and 2.2 as if the Initial Consideration were the only consideration payable in connection with such Deemed Liquidation Event; and (b) any Additional Consideration which becomes payable to the stockholders of the Corporation upon satisfaction of such contingencies shall be allocated among the holders of capital stock of the Corporation in accordance with Sections 2.1 and 2.2 after taking into account the previous payment of the Initial Consideration as part of the same transaction. For the purposes of this Section 2.3.4, consideration placed into escrow or retained as a holdback to be available for satisfaction of indemnification or similar obligations in connection with such Deemed Liquidation Event shall be deemed to be [Initial Consideration] [Additional Consideration].
