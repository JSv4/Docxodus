          - heading "6.5 Rights Subsequent to Redemption. If the Redemption Notice shall have been duly given, and if on the applicable Redemption Date the Redemption Price payable upon redemption of the shares of Preferred Stock to be redeemed on such Redemption Date is paid or tendered for payment or deposited with an independent payment agent so as to be available therefor in a timely manner, then notwithstanding that any certificates evidencing any of the shares of Preferred Stock so called for redemption shall not have been surrendered, dividends with respect to such shares of Preferred Stock shall cease to accrue after such Redemption Date and all rights with respect to such shares shall forthwith after the Redemption Date terminate, except only the right of the holders to receive the Redemption Price without interest upon surrender of any such certificate or certificates therefor.]" [level=5] [ref=e682]:
