  - paragraph [ref=f24e32]: Click any paragraph, heading, table cell, footnote or header/footer line to edit it. Enter splits a block, Backspace at the start merges it into the previous one, Ctrl+Z undoes. Only the block you changed re-renders — everything else keeps full fidelity, and Save writes a lossless .docx.