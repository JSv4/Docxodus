<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Standalone export harness</title>
</head>
<body>
  <p id="status">ready</p>
  <script type="module">
    import {
      awaitFinalPrintReadiness,
      canonicalJson,
      convertDocxToPaginatedHtml,
      DocxodusExportError,
      FONT_RESOLVER_CONTRACT_ID,
      FONT_RESOLVER_SCHEMA_VERSION,
      FONT_SUBSTITUTION_CONTRACT_MATERIAL,
      FONT_SUBSTITUTION_CONTRACT_VERSION,
      inventoryDocumentFontRequests,
      parseCssFontFamily,
      PrintReadinessError,
    } from './export-browser.js';

    let readinessProbe;
    let readinessSettled = true;
    let activeGraphic;

    async function sha256(value) {
      const bytes = typeof value === 'string' ? new TextEncoder().encode(value) : value;
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, '0')).join('');
    }

    function configuredResolver(plan) {
      let calls = 0;
      return async request => {
        calls++;
        const substitutionContractDigest = await sha256(
          canonicalJson(FONT_SUBSTITUTION_CONTRACT_MATERIAL),
        );
        if (plan.mode === 'missing') {
          return {
            schemaVersion: FONT_RESOLVER_SCHEMA_VERSION,
            resolverContract: FONT_RESOLVER_CONTRACT_ID,
            substitutionContractVersion: FONT_SUBSTITUTION_CONTRACT_VERSION,
            substitutionContractDigest,
            outcomes: request.requests.map(item => ({
              requestId: item.id,
              requestedFamily: item.familyStack[0],
              status: 'missing',
              glyphCoverage: 'unverified',
            })),
            faces: [],
          };
        }
        const faces = request.requests.map(item => ({
          id: `fixture-${item.id}`,
          resolvedFamily: plan.mode === 'substituted'
            ? 'Docxodus Canvas Mono'
            : item.familyStack[0],
          postscriptName: `DocxodusFixture-${item.id}`,
          version: plan.drift && calls > 1 ? 'fixture-v2' : 'fixture-v1',
          style: item.style,
          weight: item.weight,
          stretch: item.stretch,
          format: plan.format,
          mediaType: plan.mediaType,
          byteLength: plan.byteLength,
          sha256: plan.sha256,
          bytesBase64: plan.bytesBase64,
          licenseEvidence: {
            kind: plan.attested ? 'attested' : 'installable',
            identity: plan.licenseIdentity,
            noSubsetting: false,
          },
        }));
        return {
          schemaVersion: FONT_RESOLVER_SCHEMA_VERSION,
          resolverContract: FONT_RESOLVER_CONTRACT_ID,
          substitutionContractVersion: FONT_SUBSTITUTION_CONTRACT_VERSION,
          substitutionContractDigest,
          outcomes: request.requests.map((item, index) => ({
            requestId: item.id,
            requestedFamily: item.familyStack[0],
            resolvedFamily: faces[index].resolvedFamily,
            status: plan.mode === 'substituted' ? 'substituted' : 'resolved',
            faceId: faces[index].id,
            metricCompatible: plan.mode !== 'substituted',
            faceMatch: 'exact',
            glyphCoverage: 'complete',
          })),
          faces,
        };
      };
    }

    function resetReadinessFixture(options) {
      document.getElementById('readiness-fixture')?.remove();
      const fixture = document.createElement('section');
      fixture.id = 'readiness-fixture';
      const style = options.fontUrl
        ? `<style>@font-face{font-family:"Docxodus Delayed Readiness";src:url("${options.fontUrl}") format("woff2")}
          .readiness-font{font-family:"Docxodus Delayed Readiness"}</style>`
        : '';
      const image = options.imageUrl
        ? `<img alt="delayed-readiness-image" src="${options.imageUrl}" width="32" height="32">`
        : '';
      fixture.innerHTML = `${style}<div class="page-box" data-page-number="1"
        data-section-index="0" style="width:612pt;height:792pt">
        <p class="readiness-font" data-source-anchor-id="p:main:readiness">Delayed readiness text</p>
        ${image}
        <svg data-docxodus-materialization="chart"
          data-docxodus-materialization-state="pending"
          data-docxodus-materialization-id="delayed-chart"></svg>
      </div>`;
      document.body.appendChild(fixture);
      activeGraphic = fixture.querySelector('svg');
    }

    async function runReadinessProbe(options) {
      const started = performance.now();
      try {
        const result = await awaitFinalPrintReadiness(document, {
          timeoutMs: options.timeoutMs,
          quietIntervalMs: options.quietIntervalMs ?? 100,
        });
        return { ok: true, elapsedMs: performance.now() - started, result };
      } catch (error) {
        if (!(error instanceof PrintReadinessError)) throw error;
        return {
          ok: false,
          elapsedMs: performance.now() - started,
          error: {
            phase: error.phase,
            message: error.message,
            pending: Array.from(error.pending),
          },
        };
      } finally {
        readinessSettled = true;
      }
    }

    window.DocxodusStandalone = {
      canonicalJson,
      convert: (bytes, options) => convertDocxToPaginatedHtml(
        new Uint8Array(bytes),
        { wasmBasePath: './', ...options },
      ),
      convertAfterCallerMutation: async (bytes, options) => {
        const input = new Uint8Array(bytes);
        const conversion = convertDocxToPaginatedHtml(
          input,
          { wasmBasePath: './', ...options },
        );
        input.fill(0);
        return conversion;
      },
      convertFailure: async (bytes, options) => {
        try {
          await convertDocxToPaginatedHtml(
            new Uint8Array(bytes),
            { wasmBasePath: './', ...options },
          );
          return { unexpectedSuccess: true };
        } catch (error) {
          if (!(error instanceof DocxodusExportError)) throw error;
          return error.toJSON();
        }
      },
      convertWithDelayedPagination: async (bytes, options, delayMs = 50) => {
        const previousProgress = globalThis.__docxodusReadinessProgress;
        let paginationEntered = false;
        try {
          globalThis.__docxodusReadinessProgress = (snapshot) => {
            if (snapshot.phase !== 'pagination' || snapshot.status !== 'pending') return;
            paginationEntered = true;
            const delayUntil = performance.now() + delayMs;
            while (performance.now() < delayUntil) {
              // Deliberately hold the pagination phase long enough to model delayed layout work.
            }
          };
          const unexpectedSuccess = await convertDocxToPaginatedHtml(
            new Uint8Array(bytes),
            { wasmBasePath: './', ...options },
          );
          return { paginationEntered, unexpectedSuccess };
        } catch (error) {
          if (!(error instanceof DocxodusExportError)) throw error;
          return { paginationEntered, error: error.toJSON() };
        } finally {
          if (previousProgress === undefined) delete globalThis.__docxodusReadinessProgress;
          else globalThis.__docxodusReadinessProgress = previousProgress;
        }
      },
      convertWithFontResolver: (bytes, options, plan) => convertDocxToPaginatedHtml(
        new Uint8Array(bytes),
        { wasmBasePath: './', ...options, fontResolver: configuredResolver(plan) },
      ),
      convertWithFontResolverFailure: async (bytes, options, plan) => {
        try {
          await convertDocxToPaginatedHtml(
            new Uint8Array(bytes),
            { wasmBasePath: './', ...options, fontResolver: configuredResolver(plan) },
          );
          return { unexpectedSuccess: true };
        } catch (error) {
          if (!(error instanceof DocxodusExportError)) throw error;
          return error.toJSON();
        }
      },
      parseFontFamilies: value => parseCssFontFamily(value),
      inventoryFontFixture: async (html, limits = {}) => {
        const frame = document.createElement('iframe');
        frame.sandbox.add('allow-same-origin');
        const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
        frame.srcdoc = `<!doctype html><html><body>${html}</body></html>`;
        document.body.appendChild(frame);
        await loaded;
        try {
          return inventoryDocumentFontRequests(frame.contentDocument, {
            fontRequests: limits.fontRequests ?? 64,
            fontSampleCodePoints: limits.fontSampleCodePoints ?? 4096,
          });
        } finally {
          frame.remove();
        }
      },
      startReadinessProbe: (options) => {
        resetReadinessFixture(options);
        readinessSettled = false;
        readinessProbe = runReadinessProbe(options);
      },
      releaseReadinessGraphic: () => {
        if (!activeGraphic) throw new Error('No readiness graphic is active.');
        activeGraphic.setAttribute('viewBox', '0 0 32 32');
        activeGraphic.innerHTML = '<rect width="32" height="32" fill="#4f46e5"></rect>';
        activeGraphic.setAttribute('data-docxodus-materialization-state', 'complete');
      },
      releaseReadinessGraphicWithDelayedTreeMutation: (delayMs) => {
        if (!activeGraphic) throw new Error('No readiness graphic is active.');
        activeGraphic.setAttribute('viewBox', '0 0 32 32');
        activeGraphic.innerHTML = '<rect width="32" height="32" fill="#4f46e5"></rect>';
        activeGraphic.setAttribute('data-docxodus-materialization-state', 'complete');
        setTimeout(() => {
          const page = document.querySelector('#readiness-fixture .page-box');
          page?.setAttribute('data-delayed-layout', 'complete');
        }, delayMs);
      },
      readinessProbeSettled: () => readinessSettled,
      finishReadinessProbe: () => readinessProbe,
    };
    window.DocxodusStandaloneReady = true;
  </script>
</body>
</html>
