<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Docxodus — document editor</title>
  <style>
    /* This page is a HOST, not a design.
       The whole editor surface — ribbon chrome, anchor rail, table picker, loading
       overlay and its responsive behaviour — ships in `mountRibbon` (npm/src/ribbon.ts),
       which is also what the GitHub Pages demo and the compact iframe player use. The shared demo loader imports the same build used by GitHub Pages, including
       optional version history.

       Everything below is page framing: fill the viewport so the surface manages its
       own scrolling (the ribbon stays put on a phone instead of scrolling away). */
    html, body { height: 100%; }
    /* !important: the converter injects its own "body { margin: 20px }" into this page. */
    body { margin: 0 !important; }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { loadDemoEngine } from './engine.js';
    try {
      const { createRibbonEditor, getWasmExports } = await loadDemoEngine();
      const sample = await fetch('./sample.docx');
      const ribbon = await createRibbonEditor('#app', sample.ok ? './sample.docx' : null, {
        frame: 'flush', headerFooter: true,
        documentName: sample.ok ? 'sample.docx' : 'Untitled.docx',
      });
      window.__ribbon = ribbon;
      window.__selectTab = name => ribbon.selectTab(name);
      window.__demo = {
        ribbon, exports: getWasmExports(),
        openDoc: (bytes, name) => ribbon.open(bytes, name),
        getEditor: () => ribbon.editor,
      };
    } catch (error) {
      const message = document.createElement('p'); message.textContent = `The editor could not start. ${error}`;
      document.getElementById('app').append(message);
    }
  </script>
</body>
</html>
