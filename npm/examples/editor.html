<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Docxodus — document editor</title>
  <style>
    /* This page is a HOST, not a design.
       The whole editor surface — ribbon chrome, anchor rail, table picker, loading
       overlay and its responsive behaviour — ships in `mountRibbon` (npm/src/ribbon.ts),
       which is also what the GitHub Pages demo and the compact iframe player use. All
       this page does is boot the .NET runtime from ./_framework and hand the exports
       over, which is the one thing a CDN embed does differently.

       Everything below is page framing: fill the viewport so the surface manages its
       own scrolling (the ribbon stays put on a phone instead of scrolling away). */
    html, body { height: 100%; }
    body { margin: 0; }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>document.write('<script src="./editor.bundle.js?t=' + Date.now() + '"><\/script>');</script>
  <script type="module">
    import { dotnet } from './_framework/dotnet.js';

    const { mountRibbon } = window.DocxodusEditor;

    // Bands on by default here: this page is where header/footer editing is exercised.
    const ribbon = mountRibbon('#app', {
      headerFooter: true,
      documentName: 'no document',
      loader: {
        eyebrow: 'Local .NET runtime',
        meta: 'DOCX → WASM → DOCX',
        onRetry: () => location.reload(),
      },
    });

    // `__selectTab` reaches a control on a non-active tab without depending on pointer
    // geometry, so it is available from the first paint.
    window.__selectTab = (name) => ribbon.selectTab(name);
    window.__ribbon = ribbon;

    try {
      ribbon.loader.stage(0);
      const { getAssemblyExports, getConfig } = await dotnet.withDiagnosticTracing(false).create();
      const config = getConfig();
      const wasm = await getAssemblyExports(config.mainAssemblyName);
      const exports = {
        DocxSessionBridge: wasm.DocxodusWasm.DocxSessionBridge,
        DocumentConverter: wasm.DocxodusWasm.DocumentConverter,
      };
      ribbon.setExports(exports);

      // Load the bundled sample when there is one, so there is something to edit immediately.
      ribbon.loader.stage(1);
      let sample = null;
      try {
        const response = await fetch('./sample.docx');
        if (response.ok) sample = new Uint8Array(await response.arrayBuffer());
      } catch {
        /* no sample in this webroot — start empty */
      }

      ribbon.loader.stage(2);
      if (sample) ribbon.open(sample, 'sample.docx');
      else ribbon.setStatus('Ready — open a .docx');

      ribbon.loader.stage(3);
      ribbon.loader.done();

      // Published only once the engine is usable: specs treat `__demo` as the
      // "surface is live" signal and drive the ribbon the moment it appears.
      window.__demo = {
        ribbon,
        exports,
        openDoc: (bytes, name) => ribbon.open(bytes, name),
        getEditor: () => ribbon.editor,
      };
    } catch (error) {
      ribbon.loader.fail(error);
    }
  </script>
</body>
</html>
