name: CodeQL

# Advanced setup, replacing GitHub's managed "default setup". Default setup never analyzes
# pull requests from forks, and the main-branch ruleset requires a CodeQL result before
# merge, so every external contribution was blocked on a check that could not start.
# This workflow mirrors the default-setup configuration it replaces (same languages,
# buildless extraction, security-extended queries, weekly schedule) and keeps the
# `/language:<lang>` categories so existing alerts carry over.
#
# Default setup must be switched off in Settings -> Code security when this lands: GitHub
# rejects uploads from an advanced-setup workflow while default setup is enabled.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
