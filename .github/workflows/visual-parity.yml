name: LibreOffice visual parity

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Optional comma-separated corpus case IDs
        required: false
        type: string
      strict:
        description: Fail if any renderer-attributable case is severe
        required: false
        default: false
        type: boolean
      ratchet:
        description: Fail if any case got worse than the committed record
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '41 8 * * 1'

permissions:
  contents: read

jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install deterministic rendering tools and fonts
        run: >-
          sudo apt-get update && sudo apt-get install -y
          poppler-utils fonts-liberation2
          fonts-crosextra-carlito fonts-crosextra-caladea

      # The LibreOffice reference-version contract (issue #403): the benchmark's numbers are only
      # meaningful against the version ratchet.json was recorded under, so CI installs that exact
      # TDF build instead of whatever `ubuntu-latest` apt carries. The bundled Carlito/Caladea/
      # Liberation copies are removed because they silently override the font-substitution
      # contract inside LibreOffice only (the issue-#400 finding). Keep the version here in step
      # with LIBREOFFICE_CONTRACT in npm/tests/visual-parity/environment-contract.ts — the run
      # fails at start, with this same guidance, when they drift.
      - name: Install pinned LibreOffice 25.8.7.3 (reference-version contract)
        run: |
          curl -sSL -o /tmp/libreoffice.tar.gz \
            "https://downloadarchive.documentfoundation.org/libreoffice/old/25.8.7.3/deb/x86_64/LibreOffice_25.8.7.3_Linux_x86-64_deb.tar.gz"
          tar -xzf /tmp/libreoffice.tar.gz -C /tmp
          sudo dpkg -i /tmp/LibreOffice_*_Linux_x86-64_deb/DEBS/*.deb
          sudo rm -f /opt/libreoffice25.8/share/fonts/truetype/Carlito*.ttf \
            /opt/libreoffice25.8/share/fonts/truetype/Caladea*.ttf \
            /opt/libreoffice25.8/share/fonts/truetype/Liberation*.ttf
          sudo ln -sf /opt/libreoffice25.8/program/soffice /usr/local/bin/libreoffice
          sudo ln -sf /opt/libreoffice25.8/program/soffice /usr/local/bin/soffice
          libreoffice --version

      - name: Install npm dependencies
        run: cd npm && npm ci

      - name: Build npm package
        run: cd npm && npm run build

      - name: Install Chromium
        run: cd npm && npx playwright install --with-deps chromium

      # The regression ratchet (issue #395) compares this run against the committed record and
      # fails when any case got worse. A scheduled run has no `inputs`, so the expression falls
      # through to '1' — the weekly run is the one that most needs the gate, because nobody is
      # watching it. Refresh the record deliberately in the PR that changes rendering.
      - name: Compare stratified corpus with LibreOffice
        env:
          DOCXODUS_VISUAL_PARITY_OUTPUT: ${{ runner.temp }}/docxodus-visual-parity
          DOCXODUS_VISUAL_PARITY_FILTER: ${{ inputs.filter }}
          DOCXODUS_VISUAL_PARITY_STRICT: ${{ inputs.strict && '1' || '0' }}
          DOCXODUS_VISUAL_PARITY_RATCHET: ${{ github.event_name == 'workflow_dispatch' && !inputs.ratchet && '0' || '1' }}
        run: cd npm && npm run test:visual-parity

      - name: Upload visual comparison report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: libreoffice-visual-parity
          path: ${{ runner.temp }}/docxodus-visual-parity/
          if-no-files-found: warn
          retention-days: 14
