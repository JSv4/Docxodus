name: Perf

# Allocation regression gate (issue #976). Runs the DocxDiff stress harness and the complex-form
# benchmark against the PR's base-commit library and its head library on one runner, and fails
# when any case allocates more than 10% above base. Allocation repeats to well under 1% between
# runs of one build; wall time on a shared runner does not, so time is reported in the job
# summary but never gated. The complex-form harness also fails the job if one of its redline
# invariants breaks on the head commit. See scripts/perf-run.sh.
on:
  pull_request:
    paths:
      - 'Docxodus/**'
      - 'benchmarks/docxdiff-stress/**'
      - 'benchmarks/complex-form-doc/**'
      - 'TestFiles/NVCA-Model-COI.docx'
      - 'scripts/perf-run.sh'
      - 'scripts/perf-compare.py'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compare allocations with the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/perf-run.sh "${BASE_SHA:-$(git merge-base HEAD origin/main)}" perf-results

      - name: Upload benchmark output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: perf-results/
