<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Docxodus — DOCX GOLF: course play on a live Word document</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Five holes of document golf, played in the real in-browser Docxodus editor: each hole is a start document and a target, and the referee is the DocxDiff comparison engine itself — the hole is cleared when your document diffs to zero revisions against the target. Par, strokes, a live caddie, and a real redline view. 100% in-browser via WebAssembly." />

  <!-- Share THIS page's URL. Social platforms link through to the live game. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DOCX GOLF — course play on a live Word document" />
  <meta property="og:description" content="Edit a real Word document to match the target in as few strokes as you can. The referee is a document comparison engine: zero revisions left = hole clear. Runs entirely in your browser." />
  <meta property="og:url" content="https://jsv4.github.io/Docxodus/demo/golf.html" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="DOCX GOLF — course play on a live Word document" />
  <meta name="twitter:description" content="Five holes. Real editor, real tables, real styles — and a diff engine for a referee. Clear the hole by editing your document until zero differences remain." />

  <style>
    /* A HOST page, like arcade.html: the editor surface ships in the npm
       package (`createRibbonEditor`); the game and its caddie panel are demo
       content living beside this page (`docx-golf.js`). The page owns only
       the two-pane layout and the iframe power-on screen. */
    html, body { height: 100%; }
    body { margin: 0; background: #e8ecf2; }
    html, body * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* dvh tracks the browser chrome's dynamic collapse on phones; 100% is the
       fallback for engines without it. */
    #layout { display: flex; height: 100%; height: 100dvh; min-height: 0; }
    #app { flex: 1; min-width: 0; height: 100%; }
    #caddie { width: 340px; flex: none; height: 100%; }
    @media (max-width: 900px) {
      #layout { flex-direction: column; }
      #app { height: 58%; }
      #caddie { width: auto; height: 42%; border-left: 0; border-top: 1px solid #d7dfd9; }
    }
    /* Phone: the caddie (docx-golf.js) docks itself as a fixed scorecard bar
       with a bottom sheet, so the document takes the whole column and only
       reserves the bar's height at the bottom. */
    @media (max-width: 640px) {
      #app { flex: 1; height: auto; min-height: 0;
        padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
      #caddie { width: auto; height: auto; max-height: none; overflow: visible; border-top: 0; }
      /* The ribbon's compact table picker docks to the viewport bottom, which
         the caddie bar now owns — lift it above the bar. */
      #app .dxr-pop[data-open] { bottom: calc(96px + env(safe-area-inset-bottom)); }
    }
    #home {
      position: fixed; top: 10px; right: 356px; z-index: 50;
      font: 12px/1 system-ui, sans-serif; color: #33465b;
      background: #ffffffd9; border: 1px solid #d3dae4; border-radius: 999px;
      padding: 7px 12px; backdrop-filter: blur(4px);
      text-decoration: none;
    }
    @media (max-width: 900px) { #home { right: 12px; } }
    #home:hover { color: #101418; background: #fff; border-color: #b9c4d4; }
    #app .dxr-titlebar { padding-right: 96px; }
    body:has(.dxr[data-state="loading"]) #home,
    body:has(.dxr[data-state="error"]) #home { display: none; }

    /* Power-on screen: shown instead of auto-booting when the page is inside
       an iframe, so a feed embed never streams a .NET runtime unasked. */
    #boot[hidden] { display: none; }
    #boot {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      background: radial-gradient(ellipse at center, #10301c 0%, #0a140d 70%);
      color: #d5e8da; cursor: pointer;
      font: 14px/1.7 "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      text-align: center;
    }
    #boot .title { color: #4ade80; font-size: clamp(18px, 4vw, 28px); letter-spacing: .18em; font-weight: 700; }
    #boot .coin { margin-top: 18px; color: #ffd166; animation: blink 1.1s steps(1) infinite; }
    #boot .sub { margin-top: 10px; color: #7a998a; font-size: 11.5px; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <a id="home" href="./" title="Back to the Docxodus overview">About ↗</a>
  <div id="layout">
    <div id="app"></div>
    <div id="caddie"></div>
  </div>

  <div id="boot" hidden>
    <div>
      <div class="title">DOCX GOLF</div>
      <div class="coin">⛳ TEE UP — CLICK TO POWER ON</div>
      <div class="sub">edit a live Word document to match the target — a diff engine keeps score<br>
        runs entirely in your browser · nothing uploaded</div>
    </div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    // Golf shares the site-wide engine pin with its sibling pages; ?engine=
    // retargets only the library (the Playwright spec points it at the local
    // bundle).
    const ENGINE = params.get("engine")
      ?? "https://cdn.jsdelivr.net/npm/docxodus@12.0.0/dist/embed.bundle.js";
    const engineUrl = new URL(ENGINE, location.href);
    // The game is demo content, not library machinery: it lives beside this
    // page (docs/demo/ deploys verbatim; pretest copies the same file into
    // the local webroot), so it versions with the site, not the pin.
    const GAME_URL = params.get("game") ?? "./docx-golf.js";

    async function powerOn() {
      try {
        const [engine, { startGolf, mountGolfPanel }] =
          await Promise.all([import(engineUrl.href), import(GAME_URL)]);

        const ribbon = await engine.createRibbonEditor("#app", null, {
          documentName: "docx-golf.docx",
          frame: "flush",
          headerFooter: false,
          hint: "Your ball is the document. Edit it toward the target — the caddie on the right keeps score.",
          loader: {
            eyebrow: "Running locally in this tab",
            meta: "a live DOCX as the golf ball",
          },
        });

        const editor = ribbon.editor;
        const session = new engine.DocxSession(
          editor.sessionHandle, engine.getWasmExports().DocxSessionBridge);
        const { ui } = mountGolfPanel(document.getElementById("caddie"));
        const controller = startGolf({ editor, session, engine, ui });

        window.__golf = { ...controller, editor, ribbon, session };
      } catch (error) {
        document.getElementById("app").innerHTML =
          '<div style="display:grid;place-items:center;height:100%;padding:24px;text-align:center;'
          + 'font:14px/1.6 system-ui,sans-serif;color:#33465b"><div><strong>The course could not open.</strong>'
          + '<p id="bootError" style="margin:8px 0 16px;color:#5d6975"></p>'
          + '<button onclick="location.reload()" style="font:inherit;padding:8px 14px;border:1px solid #d3dae4;'
          + 'border-radius:8px;background:#fff;cursor:pointer">Retry</button></div></div>';
        document.getElementById("bootError").textContent = String(error).slice(0, 220);
        window.__golfError = String(error);
      }
    }

    // Inside an iframe the course waits for a click: an embed in someone's
    // page must not stream a .NET runtime unasked. Top-level it boots at once.
    const embedded = window.self !== window.top;
    const bootMode = params.get("boot") ?? (embedded ? "tap" : "auto");
    if (bootMode === "tap") {
      const boot = document.getElementById("boot");
      boot.hidden = false;
      boot.addEventListener("click", () => { boot.remove(); powerOn(); }, { once: true });
    } else {
      powerOn();
    }
  </script>
</body>
</html>
