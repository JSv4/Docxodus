<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Docxodus — the DOCX Observatory, inside the live editor</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Procedural ASCII phenomena animated inside a real Word document, hosted by the in-browser Docxodus editor. Pause anywhere: it is only a document — edit it, undo frame by frame, save the caught wave as .docx." />
  <style>
    /* A HOST page, like app.html: the editor surface ships in the npm package
       (`createRibbonEditor`); the phenomena and frame loop are demo content and
       live beside this page (`ascii-scenes.js`). The page's only original chrome
       is the observatory dock pinned under the document. */
    html, body { height: 100%; }
    body { margin: 0; background: #e8ecf2; }
    /* Chrome on Android's text autosizer (the system "Text scaling" setting)
       inflates text-heavy blocks while the document's authored column width
       stays fixed, re-breaking every line the document says. Opt the editor
       surface out; the property is non-inherited and Blink consults the
       autosizing cluster roots it picks itself, hence the universal selector.
       Newer engines emit this inside the document render too; page-level
       covers the pinned engine today. */
    html, body * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #app { height: 100%; }
    #home {
      position: fixed; top: 10px; right: 12px; z-index: 50;
      font: 12px/1 system-ui, sans-serif; color: #33465b;
      background: #ffffffd9; border: 1px solid #d3dae4; border-radius: 999px;
      padding: 7px 12px; backdrop-filter: blur(4px);
      text-decoration: none;
    }
    #home:hover { color: #101418; background: #fff; border-color: #b9c4d4; }
    #app .dxr-titlebar { padding-right: 84px; }
    body:has(.dxr[data-state="loading"]) #home,
    body:has(.dxr[data-state="error"]) #home { display: none; }

    #dock {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 60; max-width: min(960px, calc(100vw - 24px));
      display: flex; flex-direction: column; gap: 5px; align-items: center;
      background: rgba(11, 15, 26, 0.94); color: #d5dce8;
      border: 1px solid #1f2a3f; border-radius: 10px;
      padding: 8px 14px 7px;
      font: 12px/1.4 "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    #dock .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
    #dock button, #dock select {
      appearance: none; background: #111827; color: #d5dce8;
      border: 1px solid #1f2a3f; border-radius: 6px;
      font: inherit; font-size: 11.5px; padding: 4px 10px; cursor: pointer;
    }
    #dock button:hover { background: #18233a; }
    #dock button[aria-pressed="true"] { background: #123a34; color: #5eead4; }
    #dock button:disabled { opacity: 0.4; cursor: default; }
    #dockstats { color: #7a8699; font-size: 11px; white-space: nowrap; overflow-x: auto; max-width: 100%; }
    #dockstats b { color: #d5dce8; font-weight: 600; }
    #dockstats .inc { color: #5eead4; }
    #dockhint { color: #7a8699; font-size: 10.5px; }
    #dockhint b { color: #d5dce8; font-weight: 600; }
  </style>
</head>
<body>
  <a id="home" href="./" title="Back to the Docxodus overview">About ↗</a>
  <div id="app"></div>

  <div id="dock" hidden>
    <div class="row" id="dockscenes"></div>
    <div class="row">
      <button id="playpause">Pause</button>
      <button id="step" disabled>Step</button>
      <select id="pace" title="Target frame pacing">
        <option value="125" selected>8 fps</option>
        <option value="83">12 fps</option>
        <option value="0">unthrottled</option>
      </select>
      <span id="dockstats">warming up…</span>
    </div>
    <div id="dockhint">Click the sea to catch it — then it is only a document: type into it, use the ribbon,
      <b>Undo rewinds frame by frame</b>, and the ribbon's <b>Save</b> downloads the caught wave.</div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    // The observatory needs DocxEditor.refresh() (docxodus ≥ 9.6.0); this page was
    // pinned there ahead of that release and now shares the pin with its siblings.
    const ENGINE = params.get("engine")
      ?? "https://cdn.jsdelivr.net/npm/docxodus@11.0.0/dist/embed.bundle.js";
    const engineUrl = new URL(ENGINE, location.href);
    // The phenomena are demo content, not library machinery: they live beside this
    // page (docs/demo/ deploys verbatim; pretest copies the same file into the local
    // webroot), so ?engine= pins the library alone and the scenes version with the site.
    const SCENES_URL = params.get("scenes") ?? "./ascii-scenes.js";

    try {
      const [{ createRibbonEditor, DocxSession, getWasmExports }, { startObservatory }] =
        await Promise.all([import(engineUrl.href), import(SCENES_URL)]);

      const ribbon = await createRibbonEditor("#app", null, {
        documentName: "docx-observatory.docx",
        headerFooter: false,
        hint: "The sea below is a Word paragraph. Pause the animation (or click the water) and edit it like any other document.",
        loader: {
          eyebrow: "Running locally in this tab",
          meta: "a live DOCX as the framebuffer",
        },
      });

      const editor = ribbon.editor;
      const bridge = getWasmExports().DocxSessionBridge;
      const session = new DocxSession(editor.sessionHandle, bridge);
      const controller = startObservatory({
        editor,
        session,
        ui: {
          scenes: document.getElementById("dockscenes"),
          playpause: document.getElementById("playpause"),
          step: document.getElementById("step"),
          pace: document.getElementById("pace"),
          stats: document.getElementById("dockstats"),
        },
      });
      document.getElementById("dock").hidden = false;

      window.__moneyshot = { ...controller, editor, ribbon, session, bridge };
    } catch (error) {
      document.getElementById("app").innerHTML =
        '<div style="display:grid;place-items:center;height:100%;padding:24px;text-align:center;'
        + 'font:14px/1.6 system-ui,sans-serif;color:#33465b"><div><strong>The observatory could not start.</strong>'
        + '<p id="bootError" style="margin:8px 0 16px;color:#5d6975"></p>'
        + '<button onclick="location.reload()" style="font:inherit;padding:8px 14px;border:1px solid #d3dae4;'
        + 'border-radius:8px;background:#fff;cursor:pointer">Retry</button></div></div>';
      document.getElementById("bootError").textContent = String(error).slice(0, 220);
      window.__moneyshotError = String(error);
    }
  </script>
</body>
</html>
