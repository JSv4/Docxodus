<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Docxodus — REDLINE THEATER: an agent negotiating a contract, live</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Three counsel negotiate a Master Services Agreement through real MCP tool calls — JSON-RPC 2.0 frames on a live wire console — and every edit lands as native Word tracked-change markup while you watch. Ends by proving the redline rejects back to the baseline. 100% in-browser via WebAssembly." />

  <!-- Share THIS page's URL. Social platforms link through to the live demo. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="REDLINE THEATER — watch an agent redline a contract through MCP" />
  <meta property="og:description" content="Real JSON-RPC tool calls, real tracked changes, three attributed reviewers, and a reversibility proof at the end. Runs entirely in your browser." />
  <meta property="og:url" content="https://jsv4.github.io/Docxodus/demo/redline.html" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="REDLINE THEATER — watch an agent redline a contract through MCP" />
  <meta name="twitter:description" content="Every edit you see land was dispatched from a JSON-RPC 2.0 tools/call frame and recorded as native Word markup. The wire is on screen. So is the proof." />

  <style>
    /* A HOST page, like golf.html and arcade.html: the editor surface ships in
       the npm package (`createRibbonEditor`); the show and its stage panel are
       demo content living beside this page (`redline-theater.js`, `mcp-wire.js`).
       The page owns only the two-pane layout and the iframe power-on screen. */
    html, body { height: 100%; }
    body { margin: 0; background: #0f172a; }
    html, body * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* dvh tracks the browser chrome's dynamic collapse on phones; 100% is the
       fallback for engines without it. */
    #layout { display: flex; height: 100%; height: 100dvh; min-height: 0; }
    #app { flex: 1; min-width: 0; height: 100%; background: #e8ecf2; }
    #stage { width: 400px; flex: none; height: 100%; }
    @media (max-width: 1100px) { #stage { width: 340px; } }
    @media (max-width: 900px) {
      #layout { flex-direction: column; }
      #app { height: 52%; }
      #stage { width: auto; height: 48%; }
    }
    #home {
      position: fixed; top: 10px; right: 416px; z-index: 50;
      font: 12px/1 system-ui, sans-serif; color: #33465b;
      background: #ffffffd9; border: 1px solid #d3dae4; border-radius: 999px;
      padding: 7px 12px; backdrop-filter: blur(4px);
      text-decoration: none;
    }
    @media (max-width: 1100px) { #home { right: 356px; } }
    @media (max-width: 900px) { #home { right: 12px; } }
    #home:hover { color: #101418; background: #fff; border-color: #b9c4d4; }
    #app .dxr-titlebar { padding-right: 96px; }
    body:has(.dxr[data-state="loading"]) #home,
    body:has(.dxr[data-state="error"]) #home { display: none; }

    /* Power-on screen: shown instead of auto-booting when the page is inside an
       iframe, so a feed embed never streams a .NET runtime unasked. */
    #boot[hidden] { display: none; }
    #boot {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      background: radial-gradient(ellipse at center, #1e1b2e 0%, #0b0a14 70%);
      color: #e2e8f0; cursor: pointer;
      font: 14px/1.7 "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      text-align: center;
    }
    #boot .title { color: #f87171; font-size: clamp(18px, 4vw, 28px); letter-spacing: .18em; font-weight: 700; }
    #boot .coin { margin-top: 18px; color: #fbbf24; animation: blink 1.1s steps(1) infinite; }
    #boot .sub { margin-top: 10px; color: #7a8899; font-size: 11.5px; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <a id="home" href="./" title="Back to the Docxodus overview">About ↗</a>
  <div id="layout">
    <div id="app"></div>
    <div id="stage"></div>
  </div>

  <div id="boot" hidden>
    <div>
      <div class="title">REDLINE THEATER</div>
      <div class="coin">⚖ CLICK TO POWER ON</div>
      <div class="sub">three counsel, one contract, real MCP tool calls<br>
        runs entirely in your browser · nothing uploaded</div>
    </div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    // Theater shares the site-wide engine pin with its sibling pages; ?engine=
    // retargets only the library (the Playwright spec points it at the local
    // bundle).
    const ENGINE = params.get("engine")
      ?? "https://cdn.jsdelivr.net/npm/docxodus@12.0.1/dist/embed.bundle.js";
    const engineUrl = new URL(ENGINE, location.href);
    // The show is demo content, not library machinery: it lives beside this page
    // (docs/demo/ deploys verbatim; pretest copies the same files into the local
    // webroot), so it versions with the site, not the pin.
    const SHOW_URL = params.get("show") ?? "./redline-theater.js";

    async function powerOn() {
      try {
        const [engine, show] =
          await Promise.all([import(engineUrl.href), import(SHOW_URL)]);

        const ribbon = await engine.createRibbonEditor("#app", null, {
          documentName: "msa-redline.docx",
          frame: "flush",
          headerFooter: false,
          // The whole point: the session RECORDS every mutation as native
          // tracked changes, and the editor RENDERS that markup inline. One
          // option does both.
          trackedChanges: engine.TrackedChangeMode.RenderInline,
          hint: "Every mark below was written by an MCP tool call. Watch the wire on the right.",
          loader: {
            eyebrow: "Running locally in this tab",
            meta: "a contract, three counsel, and a JSON-RPC wire",
          },
        });

        const editor = ribbon.editor;
        const session = new engine.DocxSession(
          editor.sessionHandle, engine.getWasmExports().DocxSessionBridge);
        const { ui } = show.mountTheaterPanel(document.getElementById("stage"));
        const controller = show.startTheater({
          editor, session, engine, ui,
          autoRun: params.get("autorun") === "1",
        });
        if (params.get("speed")) controller.setSpeed(params.get("speed"));

        window.__theater = { ...controller, editor, ribbon, session };
        // The spec opens throwaway sessions over the saved redline to check
        // accept-all/reject-all independently of the panel's own proof.
        window.__theaterEngine = engine;
      } catch (error) {
        document.getElementById("app").innerHTML =
          '<div style="display:grid;place-items:center;height:100%;padding:24px;text-align:center;'
          + 'font:14px/1.6 system-ui,sans-serif;color:#33465b"><div><strong>The theater could not open.</strong>'
          + '<p id="bootError" style="margin:8px 0 16px;color:#5d6975"></p>'
          + '<button onclick="location.reload()" style="font:inherit;padding:8px 14px;border:1px solid #d3dae4;'
          + 'border-radius:8px;background:#fff;cursor:pointer">Retry</button></div></div>';
        document.getElementById("bootError").textContent = String(error).slice(0, 220);
        window.__theaterError = String(error);
      }
    }

    // Inside an iframe the show waits for a click: an embed in someone's page
    // must not stream a .NET runtime unasked. Top-level it boots at once.
    const embedded = window.self !== window.top;
    const bootMode = params.get("boot") ?? (embedded ? "tap" : "auto");
    if (bootMode === "tap") {
      const boot = document.getElementById("boot");
      boot.hidden = false;
      boot.addEventListener("click", () => { boot.remove(); powerOn(); }, { once: true });
    } else {
      powerOn();
    }
  </script>
</body>
</html>
