<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docxodus — live DOCX editor</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <!--
    Compact website-embed target. The page is sized for a 480x480 iframe and
    boots on tap. X no longer documents its historical Player Cards, so social
    posts link to the ordinary landing page instead. Hosting remains static:
    the engine streams from jsDelivr and the sample document comes from the
    same GitHub Pages directory.

    Query overrides (used by tests and local dev):
      ?engine=<module URL of embed bundle>   default: jsDelivr docxodus@9.1.1
      ?doc=<docx URL>                        default: local branded product guide
  -->
  <style>
    :root { color-scheme: dark; --cyan: #52e5ff; --blue: #5c7cff; --violet: #b26cff;
      --green: #52e0a2; --muted: #91a8c2; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { position: relative; margin: 0; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui,
      -apple-system, "Segoe UI", sans-serif; background: #07111f; color: #f5f9ff; display: flex; flex-direction: column; }
    body::before { position: absolute; inset: 0; content: ""; pointer-events: none; background:
      radial-gradient(circle at 15% 14%, rgba(54,126,255,.28), transparent 52%),
      radial-gradient(circle at 86% 82%, rgba(178,108,255,.22), transparent 48%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: auto, auto, 30px 30px, 30px 30px; }

    /* ── Animated poster / loader ────────────────────────────────────────── */
    #boot { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 22px; }
    .boot-art { position: relative; width: 126px; height: 126px; margin-bottom: 14px; }
    .ring { position: absolute; inset: 2px; border: 1px solid rgba(82,229,255,.25); border-radius: 50%;
      animation: spin 7s linear infinite; }
    .ring.two { inset: 17px; border-style: dashed; border-color: rgba(178,108,255,.4);
      animation-duration: 4.5s; animation-direction: reverse; }
    .ring::before { position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; border-radius: 50%;
      content: ""; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
    .mark { position: absolute; inset: 30px 37px; padding: 17px 11px; border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px; background: linear-gradient(150deg, rgba(255,255,255,.2), rgba(255,255,255,.06));
      box-shadow: 0 17px 35px rgba(0,0,0,.35); animation: float 3s ease-in-out infinite; }
    .mark::before { position: absolute; top: -7px; right: -8px; padding: 3px 5px; border-radius: 5px;
      color: #07111f; background: var(--cyan); content: "DOCX"; font-size: 6px; font-weight: 900; letter-spacing: .1em; }
    .mark span { display: block; height: 3px; margin-bottom: 7px; border-radius: 2px; background: rgba(255,255,255,.7);
      transform-origin: left; animation: pulse-line 1.9s ease-in-out infinite; }
    .mark span:nth-child(2) { width: 74%; animation-delay: -.5s; }
    .mark span:nth-child(3) { width: 88%; background: #ff8298; animation-delay: -1s; }
    .boot-kicker { color: var(--cyan); font-size: 9px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    #boot h1 { margin: 7px 0 9px; font-size: clamp(25px, 7vw, 34px); line-height: 1; letter-spacing: -.045em; }
    #boot h1 span { color: transparent; background: linear-gradient(90deg, var(--cyan), #c48cff);
      background-clip: text; -webkit-background-clip: text; }
    #boot > p { max-width: 340px; margin: 0; color: #9ab0c9; font-size: 12.5px; line-height: 1.5; }
    .feature-ticker { width: min(340px, 100%); min-height: 51px; display: flex; align-items: center; gap: 10px;
      margin: 15px 0; padding: 10px 12px; border: 1px solid rgba(136,166,201,.15); border-radius: 11px;
      background: rgba(255,255,255,.045); text-align: left; }
    .feature-ticker .number { color: var(--violet); font: 800 9px ui-monospace, monospace; }
    .feature-ticker strong { display: block; font-size: 10.5px; }
    .feature-ticker span:last-child { display: block; margin-top: 2px; color: #7890ab; font-size: 9.5px; line-height: 1.35; }
    .feature-ticker.swap { animation: swap .35s ease; }
    #start { min-width: 196px; padding: 10px 20px; border: 0; border-radius: 999px; color: #07111f;
      background: linear-gradient(135deg, var(--cyan), #89f7dd); box-shadow: 0 11px 28px rgba(82,229,255,.18);
      font-size: 12px; font-weight: 820; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    #start:hover { transform: translateY(-2px); box-shadow: 0 15px 34px rgba(82,229,255,.25); }
    #start:disabled { color: #c1d1e2; background: rgba(255,255,255,.08); box-shadow: none; cursor: wait; transform: none; }
    .boot-progress { width: min(265px, 75%); height: 2px; margin-top: 13px; overflow: hidden; border-radius: 2px;
      background: rgba(255,255,255,.08); opacity: 0; transition: opacity .2s; }
    #boot.loading .boot-progress { opacity: 1; }
    #bootProgress { width: 10%; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--violet));
      box-shadow: 0 0 13px var(--cyan); transition: width .55s ease; }
    #bootStatus { min-height: 16px; margin-top: 8px; color: #7991ac; font-size: 9.5px; }

    /* ── Editor state ────────────────────────────────────────────────────── */
    #app { position: relative; z-index: 1; display: none; flex: 1; min-height: 0; flex-direction: column; background: #eef3f8; }
    #bar { display: flex; align-items: center; gap: 3px; min-height: 44px; padding: 5px 7px;
      color: #2d4055; background: rgba(255,255,255,.97); border-bottom: 1px solid #d8e2ed; }
    #bar button { min-width: 31px; height: 31px; display: inline-grid; place-items: center; padding: 0 7px;
      border: 1px solid transparent; border-radius: 7px; color: #344b63; background: transparent;
      font-size: 11px; font-weight: 760; cursor: pointer; }
    #bar button:hover { background: #eaf1f8; border-color: #d3e0ed; }
    #bar button[aria-pressed="true"] { color: #174ca7; background: #e3edff; border-color: #bcd1ff; }
    #bar .divider { width: 1px; height: 21px; margin: 0 2px; background: #dce5ee; }
    #bar #dl { padding: 0 10px; color: #fff; background: linear-gradient(135deg, #2c63e8, #784fe7); }
    #bar .brand { margin-left: auto; padding: 6px; color: #71869c; font-size: 9px; font-weight: 750; text-decoration: none; }
    #bar .brand:hover { color: #31485f; }
    #morePanel { position: absolute; z-index: 4; top: 49px; right: 8px; width: 238px; display: grid;
      grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 9px; border: 1px solid #cad8e7;
      border-radius: 12px; background: rgba(250,253,255,.98); box-shadow: 0 18px 48px rgba(23,43,67,.25); }
    #morePanel[hidden] { display: none; }
    #morePanel button { min-width: 0; height: 34px; border: 1px solid #dbe5ef; border-radius: 7px;
      color: #344b63; background: #f4f8fc; font-size: 10px; font-weight: 760; cursor: pointer; }
    #morePanel button:hover { color: #174ca7; background: #e7f0ff; border-color: #bfd2ee; }
    #morePanel button[aria-pressed="true"] { color: #174ca7; background: #e3edff; border-color: #bcd1ff; }
    #doc { flex: 1; overflow: auto; background: #fff; color: #111; padding: 18px 20px; }
    #doc:focus-within { outline: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(-3px) rotate(-2deg); } 50% { transform: translateY(4px) rotate(1deg); } }
    @keyframes pulse-line { 0%,100% { transform: scaleX(.6); opacity: .45; } 50% { transform: scaleX(1); opacity: 1; } }
    @keyframes swap { from { opacity: .15; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-height: 520px) { .boot-art { width: 96px; height: 96px; margin-bottom: 6px; }
      .mark { inset: 23px 28px; padding-top: 13px; } .feature-ticker { margin: 10px 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important;
      animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-art" aria-hidden="true"><div class="ring"></div><div class="ring two"></div>
      <div class="mark"><span></span><span></span><span></span></div></div>
    <div class="boot-kicker">Private · local · WebAssembly</div>
    <h1>Word editing.<br><span>Inside this box.</span></h1>
    <p>A real DOCX engine—not a screenshot. Edit native document content and save the Word file locally.</p>
    <div class="feature-ticker" id="featureTicker">
      <span class="number" id="featureNumber">01</span>
      <div><strong id="featureTitle">Zero uploads</strong><span id="featureCopy">Your document never leaves this browser.</span></div>
    </div>
    <button id="start">▶&nbsp; Launch the live editor</button>
    <div class="boot-progress" aria-hidden="true"><div id="bootProgress"></div></div>
    <div id="bootStatus" role="status" aria-live="polite">Ready when you are</div>
  </div>

  <div id="app">
    <div id="bar">
      <button data-fmt="bold" title="Bold" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button data-fmt="italic" title="Italic" aria-label="Italic" aria-pressed="false"><i>I</i></button>
      <button data-fmt="underline" title="Underline" aria-label="Underline" aria-pressed="false"><u>U</u></button>
      <span class="divider" aria-hidden="true"></span>
      <button id="undo" title="Undo" aria-label="Undo">↶</button>
      <button id="redo" title="Redo" aria-label="Redo">↷</button>
      <button id="more" title="More formatting controls" aria-label="More formatting controls" aria-expanded="false">•••</button>
      <button id="dl" title="Download the edited DOCX">Save</button>
      <a class="brand" href="https://github.com/JSv4/Docxodus" target="_blank" rel="noopener">Docxodus ↗</a>
    </div>
    <div id="morePanel" role="toolbar" aria-label="More document controls" hidden>
      <button data-fmt="strike" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button>
      <button data-fmt="superscript" title="Superscript" aria-label="Superscript" aria-pressed="false">x²</button>
      <button data-size="12" title="12 point font" aria-label="12 point font">12pt</button>
      <button data-size="18" title="18 point font" aria-label="18 point font">18pt</button>
      <button data-align="left" title="Align left" aria-label="Align left">☰</button>
      <button data-align="center" title="Align center" aria-label="Align center">≡</button>
      <button data-list="bullet" title="Bulleted list" aria-label="Bulleted list">•≡</button>
      <button data-list="decimal" title="Numbered list" aria-label="Numbered list">1≡</button>
      <button data-indent="-720" title="Decrease indent" aria-label="Decrease indent">⇤</button>
      <button data-indent="720" title="Increase indent" aria-label="Increase indent">⇥</button>
      <button id="insertTable" title="Insert 2 × 2 table" aria-label="Insert table">▦</button>
      <button id="insertRule" title="Insert horizontal rule" aria-label="Insert horizontal rule">―</button>
    </div>
    <div id="doc"></div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const ENGINE = params.get("engine")
      ?? "https://cdn.jsdelivr.net/npm/docxodus@9.1.1/dist/embed.bundle.js";
    const DOC = params.get("doc")
      ?? "./docxodus-demo-guide.docx";

    const $ = (id) => document.getElementById(id);
    const status = (text, progress) => {
      $("bootStatus").textContent = text;
      if (progress != null) $("bootProgress").style.width = `${progress}%`;
    };
    let editor = null;
    let featureIndex = 0;
    let selectionFrame = 0;
    const formatButtons = Array.from(document.querySelectorAll("#app [data-fmt]"));
    const features = [
      ["01", "Zero uploads", "Your document never leaves this browser."],
      ["02", "Native DOCX editing", "Formatting changes stay in real OOXML."],
      ["03", "Word-grade fidelity", "Tables, lists, notes, and redlines survive."],
      ["04", "Lossless save", "Download the edited Word file locally."],
    ];

    setInterval(() => {
      featureIndex = (featureIndex + 1) % features.length;
      const [number, title, copy] = features[featureIndex];
      const ticker = $("featureTicker");
      ticker.classList.remove("swap");
      void ticker.offsetWidth;
      $("featureNumber").textContent = number;
      $("featureTitle").textContent = title;
      $("featureCopy").textContent = copy;
      ticker.classList.add("swap");
    }, 1800);

    const syncFormatState = () => {
      if (!editor) return;
      const state = editor.queryFormatState();
      for (const button of formatButtons) {
        button.setAttribute("aria-pressed", String(!!state[button.dataset.fmt]));
      }
    };

    $("start").addEventListener("click", async () => {
      $("start").disabled = true;
      $("boot").classList.add("loading");
      try {
        status("Loading the .NET WebAssembly engine…", 18);
        const mod = await import(ENGINE);
        status("Opening the DOCX locally…", 52);
        const response = await fetch(DOC, { credentials: "omit" });
        if (!response.ok) throw new Error(`Could not load document (${response.status})`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        status("Wiring lossless editing controls…", 84);
        editor = await mod.createEditor("#doc", bytes);
        window.__editor = editor;
        status("Live editor ready", 100);
        $("boot").style.display = "none";
        $("app").style.display = "flex";
      } catch (err) {
        status(String(err).slice(0, 160));
        $("start").disabled = false;
        $("boot").classList.remove("loading");
      }
    });

    const closeMore = () => {
      $("morePanel").hidden = true;
      $("more").setAttribute("aria-expanded", "false");
    };
    for (const btn of document.querySelectorAll("#app button")) {
      // mousedown + preventDefault keeps the text selection alive in the block.
      btn.addEventListener("mousedown", (e) => e.preventDefault());
    }
    for (const btn of formatButtons) {
      btn.addEventListener("click", () => {
        editor?.format(btn.dataset.fmt);
        syncFormatState();
        if (btn.closest("#morePanel")) closeMore();
      });
    }
    $("more").addEventListener("click", () => {
      const willOpen = $("morePanel").hidden;
      $("morePanel").hidden = !willOpen;
      $("more").setAttribute("aria-expanded", String(willOpen));
    });
    for (const btn of document.querySelectorAll("#morePanel [data-size]")) {
      btn.addEventListener("click", () => { editor?.setFontSize(Number(btn.dataset.size)); closeMore(); });
    }
    for (const btn of document.querySelectorAll("#morePanel [data-align]")) {
      btn.addEventListener("click", () => { editor?.setAlignment(btn.dataset.align); closeMore(); });
    }
    for (const btn of document.querySelectorAll("#morePanel [data-list]")) {
      btn.addEventListener("click", () => { editor?.toggleList(btn.dataset.list); closeMore(); });
    }
    for (const btn of document.querySelectorAll("#morePanel [data-indent]")) {
      btn.addEventListener("click", () => { editor?.indent(Number(btn.dataset.indent)); closeMore(); });
    }
    $("insertTable").addEventListener("click", () => { editor?.insertTable(2, 2); closeMore(); });
    $("insertRule").addEventListener("click", () => { editor?.insertHorizontalRule(); closeMore(); });
    $("undo").addEventListener("click", () => { editor?.undo(); syncFormatState(); });
    $("redo").addEventListener("click", () => { editor?.redo(); syncFormatState(); });
    document.addEventListener("selectionchange", () => {
      cancelAnimationFrame(selectionFrame);
      selectionFrame = requestAnimationFrame(syncFormatState);
    });

    $("dl").addEventListener("click", () => {
      if (!editor) return;
      const bytes = editor.save();
      const url = URL.createObjectURL(new Blob([bytes], {
        type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }));
      const a = Object.assign(document.createElement("a"),
        { href: url, download: "docxodus-demo.docx" });
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
