<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Docxodus — THE DOCX ARCADE: a video game inside a Word document</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="A platformer, a Doom-style raycaster, Freedoom&#39;s E1M1 rasterized from the real WAD, and DOOM — the actual id Software engine, GPL-2.0, compiled to JavaScript — playable as a full-color inline image in a live Word document. Pause anywhere: it is only a document. Save mid-game as .docx." />

  <!-- Share THIS page's URL. Social platforms link through to the live game. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="THE DOCX ARCADE — a video game running inside a Word document" />
  <meta property="og:description" content="WASD works, and cartridge four is the REAL Doom engine — id&#39;s own renderer, drawing its 320×200 framebuffer into a Word paragraph. Pause and the frame is an ordinary paragraph: edit it, undo it, save it as a real .docx. 100% in-browser." />
  <meta property="og:url" content="https://jsv4.github.io/Docxodus/demo/arcade.html" />
  <meta property="og:image" content="https://raw.githubusercontent.com/JSv4/Docxodus/main/docs/images/arcade-social.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="THE DOCX ARCADE — a video game running inside a Word document" />
  <meta name="twitter:description" content="A platformer, a Doom-style raycaster, a real Doom-format level, and actual DOOM — id&#39;s GPL engine compiled to JavaScript — whose screen is a live Word paragraph. Pause and it is only a document again." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/JSv4/Docxodus/main/docs/images/arcade-social.png" />

  <style>
    /* A HOST page, like observatory.html: the editor surface ships in the npm
       package (`createRibbonEditor`); the games and their driver are demo
       content living beside this page (`ascii-arcade.js`), and the controls
       come from `arcade-dock.js` — shared with the landing page, which mounts
       this same arcade on a phone. The page's only original chrome is the
       power-on screen shown when the page is embedded in an iframe. */
    html, body { height: 100%; }
    body { margin: 0; background: #e8ecf2; }
    /* Chrome on Android's text autosizer (the system "Text scaling"
       accessibility setting) inflates text-heavy blocks while the document's
       authored column width stays fixed, re-breaking every line — the game
       screen garbles into extra wrapped rows as frames fill in. A document
       viewer never inflates document text (the fit-to-width zoom is the
       legibility affordance), so opt the whole cabinet out. The property is
       non-inherited and Blink consults the autosizing cluster roots it picks
       itself (an ancestor-only rule demonstrably does not stick on Android),
       hence the universal selector. Newer engines emit this inside the
       document render too; page-level covers the pinned engine today. */
    html, body * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #app { height: 100%; }
    #home {
      position: fixed; top: 10px; right: 12px; z-index: 50;
      font: 12px/1 system-ui, sans-serif; color: #33465b;
      background: #ffffffd9; border: 1px solid #d3dae4; border-radius: 999px;
      padding: 7px 12px; backdrop-filter: blur(4px);
      text-decoration: none;
    }
    #home:hover { color: #101418; background: #fff; border-color: #b9c4d4; }
    #app .dxr-titlebar { padding-right: 84px; }
    body:has(.dxr[data-state="loading"]) #home,
    body:has(.dxr[data-state="error"]) #home { display: none; }

    /* Phone: crop the letter page's white side margins so the game screen
       runs edge-to-edge. The editor's fit-to-width zoom measures the surface
       element, so widening it by the margins' share of the page (2 × 1in of
       the 8.5in blank doc the arcade seeds ≈ 15.4% per side) lands the 6.5in
       text column — the game bezel — exactly on the screen width, with the
       white margins hanging clipped off both edges. Presentation only: the
       document keeps its margins, and Save ships them untouched. */
    @media (max-width: 640px) {
      #app .dxr-scroll { overflow-x: hidden; }
      #app .dxr-surface { margin-left: -15.4%; margin-right: -15.4%;
        padding-left: 0; padding-right: 0; }
    }

    /* The dock, the "⋯" sheet and the thumb pad are styled by arcade-dock.js
       (`.dxa-*`), which owns both its layouts. Nothing about them is page-local
       any more — the landing page mounts the identical controls. */

    /* Power-on screen: shown instead of auto-booting when the page is inside
       an iframe, so a feed embed never streams a .NET runtime unasked. */
    /* The explicit display values below would defeat the `hidden` attribute
       (author CSS beats the UA's display:none), so restore it explicitly. */
    #boot[hidden] { display: none; }
    #boot {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      background: radial-gradient(ellipse at center, #12203a 0%, #0a0f1a 70%);
      color: #d5dce8; cursor: pointer;
      font: 14px/1.7 "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      text-align: center;
    }
    #boot .title { color: #5eead4; font-size: clamp(18px, 4vw, 28px); letter-spacing: .18em; font-weight: 700; }
    #boot .coin { margin-top: 18px; color: #ffd166; animation: blink 1.1s steps(1) infinite; }
    #boot .sub { margin-top: 10px; color: #7a8699; font-size: 11.5px; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <a id="home" href="./" title="Back to the Docxodus overview">About ↗</a>
  <div id="app"></div>

  <div id="boot" hidden>
    <div>
      <div class="title">THE DOCX ARCADE</div>
      <div class="coin">▶ INSERT COIN — CLICK TO POWER ON</div>
      <div class="sub">a video game whose screen is a live Word document<br>
        runs entirely in your browser · nothing uploaded</div>
    </div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    // The Arcade needs DocxEditor.refresh() (docxodus ≥ 9.6.0); it shares the
    // site-wide pin with its sibling pages.
    const ENGINE = params.get("engine")
      ?? "https://cdn.jsdelivr.net/npm/docxodus@12.0.1/dist/embed.bundle.js";
    const engineUrl = new URL(ENGINE, location.href);
    // The games are demo content, not library machinery: they live beside this
    // page (docs/demo/ deploys verbatim; pretest copies the same file into the
    // local webroot), so ?engine= pins the library alone and the games version
    // with the site.
    const GAMES_URL = params.get("games") ?? "./ascii-arcade.js";
    // The controls travel with the games, for the same reason: they are demo
    // content, and the landing page imports this identical module.
    const DOCK_URL = params.get("dock") ?? "./arcade-dock.js";

    // The Doom cartridge's engine and IWAD are pinned jsDelivr URLs — nothing
    // is vendored here (docs/demo/vendor/ holds only license text and the
    // provenance record; see its NOTICE.md). ?wad= points the cartridge at a
    // SAME-ORIGIN IWAD you host yourself and are licensed to play; ?sound=0
    // boots it mute. There is deliberately no engine override: a dynamic
    // import() runs whatever it is given, on this origin, so letting a link
    // choose the module would be remote code execution rather than a knob.
    // The cartridge enforces the same-origin rule itself as well.
    const doomOptions = {
      wadUrl: params.get("wad") ?? undefined,
      sound: params.get("sound") !== "0",
    };

    const embedSnippet = `<iframe
  src="https://jsv4.github.io/Docxodus/demo/arcade.html"
  width="960" height="720"
  title="THE DOCX ARCADE — a game inside a Word document"
  loading="lazy" allow="fullscreen"
  sandbox="allow-scripts allow-same-origin allow-downloads"
  style="border:0;border-radius:14px;overflow:hidden">
</iframe>`;

    async function powerOn() {
      try {
        const [{ createRibbonEditor, DocxSession, getWasmExports },
               { startArcade }, { mountArcadeDock }] =
          await Promise.all([import(engineUrl.href), import(GAMES_URL), import(DOCK_URL)]);

        const ribbon = await createRibbonEditor("#app", null, {
          documentName: "docx-arcade.docx",
          headerFooter: false,
          hint: "The game screen below is a Word paragraph. Pause (or click it) and edit it like any other document.",
          loader: {
            eyebrow: "Running locally in this tab",
            meta: "a live DOCX as the framebuffer",
          },
        });

        const editor = ribbon.editor;
        const bridge = getWasmExports().DocxSessionBridge;
        const session = new DocxSession(editor.sessionHandle, bridge);
        // Fixed to the viewport: the cabinet IS the page, so the controls
        // measure the window and float over the whole screen.
        const dock = mountArcadeDock(document.body, { embed: embedSnippet });
        const controller = startArcade({
          editor,
          session,
          cart: params.get("cart") ?? "doom",
          // ?intro=0 skips the attract screen (specs use it; humans get the
          // full "OS LEGAL presents DOCXODUS" title card).
          intro: params.get("intro") !== "0",
          ui: dock.ui,
          doom: doomOptions,
        });
        dock.show();

        window.__arcade = { ...controller, editor, ribbon, session, bridge, dock };
      } catch (error) {
        document.getElementById("app").innerHTML =
          '<div style="display:grid;place-items:center;height:100%;padding:24px;text-align:center;'
          + 'font:14px/1.6 system-ui,sans-serif;color:#33465b"><div><strong>The arcade could not start.</strong>'
          + '<p id="bootError" style="margin:8px 0 16px;color:#5d6975"></p>'
          + '<button onclick="location.reload()" style="font:inherit;padding:8px 14px;border:1px solid #d3dae4;'
          + 'border-radius:8px;background:#fff;cursor:pointer">Retry</button></div></div>';
        document.getElementById("bootError").textContent = String(error).slice(0, 220);
        window.__arcadeError = String(error);
      }
    }

    // Inside an iframe the cabinet waits for a coin: an embed in someone's
    // page must not stream a .NET runtime unasked. Top-level it boots at once.
    const embedded = window.self !== window.top;
    const bootMode = params.get("boot") ?? (embedded ? "tap" : "auto");
    if (bootMode === "tap") {
      const boot = document.getElementById("boot");
      boot.hidden = false;
      boot.addEventListener("click", () => { boot.remove(); powerOn(); }, { once: true });
    } else {
      powerOn();
    }
  </script>
</body>
</html>
